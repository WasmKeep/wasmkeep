# cargo-about: the third-party notices shipped next to the wasmkeep binary
# (scripts/notices.sh). Keep `accepted` in step with deny.toml and
# scripts/licenses.py.
accepted = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unlicense",
    "BSL-1.0",
    "CC0-1.0",
    "0BSD",
    "CDLA-Permissive-2.0",
]
# The release targets; a crate used only on other platforms is not in the
# binary.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
]
# Test and benchmark crates are never compiled into the binary.
ignore-dev-dependencies = true
# The workspace's own crates are covered by LICENSE and NOTICE. The one
# published crate, wasmkeep-sdk, is not private: scripts/notices.sh leaves
# it out of the components' notices by name.
private = { ignore = true }

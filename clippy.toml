# unwrap/expect/panic are denied in library and binary code, allowed in tests.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true

# Both ring and aws-lc-rs are compiled into rustls: every TLS config names
# its provider (ADR 0011).
disallowed-methods = [
    { path = "rustls::ClientConfig::builder", reason = "use builder_with_provider(ring)" },
    { path = "rustls::ServerConfig::builder", reason = "use builder_with_provider(ring)" },
    { path = "rustls::ClientConfig::builder_with_protocol_versions", reason = "use builder_with_provider(ring).with_protocol_versions(..)" },
    { path = "rustls::ServerConfig::builder_with_protocol_versions", reason = "use builder_with_provider(ring).with_protocol_versions(..)" },
    { path = "rustls::client::WebPkiServerVerifier::builder", reason = "use WebPkiServerVerifier::builder_with_provider(roots, ring)" },
    { path = "rustls::server::WebPkiClientVerifier::builder", reason = "use WebPkiClientVerifier::builder_with_provider(roots, ring)" },
]

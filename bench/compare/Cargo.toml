[package]
name = "wasmkeep-compare"
description = "Compares actor runtimes on the same workload (bench/run.sh)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[[bin]]
name = "compare"
path = "src/main.rs"

[target.'cfg(target_os = "linux")'.dependencies]
# The workspace's rustix, with `thread` for prctl(PR_SET_THP_DISABLE) in celld.
rustix = { workspace = true, features = ["thread"] }

[dev-dependencies]
# Only to check the harness's descriptor floor against the server's budget.
wasmkeep-server.workspace = true

[lints]
workspace = true

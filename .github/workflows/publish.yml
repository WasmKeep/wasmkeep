name: publish

# Publishes a release's SDKs to their registries: the Rust crate to
# crates.io, the TypeScript package to npm and the Python package to PyPI,
# from the release's tag, without a stored token (the registries trust this
# workflow by name: docs/releasing.md says how each is set up).
#
# It runs when a maintainer publishes the draft that release.yml opened, or
# by hand on the release's tag (Run workflow, with the tag as the ref), to
# finish a release whose run stopped half-way. Either way it runs the copy
# of this file that the tag holds, on the tag's commit: no input names what
# to publish.
#
# How it is laid out, and why:
# - `gate` and `packages` hold no publishing identity. They check the
#   release, build every package from the commit the gate checked, and ask
#   each registry what it already has. A failure here stops everything
#   before anything is published.
# - The three publishing jobs build nothing and run no package's code: each
#   takes the files `packages` built and uploads them. Only they hold the
#   identity the registries trust, behind the `registries` environment. A
#   registry that already has the version starts no job and asks for no
#   approval.
# - Nothing here can be undone: a published version stays published.
#
# The jobs stay in this file, not in a reusable workflow, and the file keeps
# its name: the registries match the calling workflow's file name. They do
# not match the branch or the tag, so the `registries` environment (its
# reviewers, and the tags it accepts) is what stands between a copy of this
# file on another branch and the registries.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

# `bash` by name runs every step with `-eo pipefail`.
defaults:
  run:
    shell: bash

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  TAG: ${{ github.ref_name }}

jobs:
  # Refuses anything but a published release of main whose tag is the
  # version of every manifest and whose commit CI passed on.
  gate:
    name: the release is what the manifests say
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha: ${{ github.sha }}
    steps:
      - name: this run is on a tag
        env:
          REF_TYPE: ${{ github.ref_type }}
        run: |
          [ "$REF_TYPE" = tag ] || {
            echo "::error::run this workflow on the release's tag, not on a branch"; exit 1; }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - id: version
        name: the tag is the version of every manifest
        run: |
          [ -f scripts/check-versions.py ] || {
            echo "::error::$TAG is from before the SDKs were published with a release"; exit 1; }
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || {
            echo "::error::'$version' is not a version"; exit 1; }
          [ "$TAG" = "v$version" ] || {
            echo "::error::tag $TAG is not v$version, the workspace version"; exit 1; }
          python3 -I scripts/check-versions.py
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: the Rust SDK is marked publishable
        run: |
          cargo metadata --no-deps --format-version 1 | python3 -c '
          import json, sys
          crate = next(p for p in json.load(sys.stdin)["packages"] if p["name"] == "wasmkeep-sdk")
          if crate["publish"] == []:
              sys.exit("::error::crates/wasmkeep-sdk/Cargo.toml says publish = false: a release sets it true (docs/releasing.md)")
          '
      - name: the release is published, and CI passed on its commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          draft=$(gh release view "$TAG" --json isDraft --jq .isDraft)
          [ "$draft" = false ] || { echo "::error::the release $TAG is still a draft"; exit 1; }
          run=$(gh run list --workflow ci.yml --commit "$SHA" --branch main --event push \
            --limit 1 --json status,conclusion --jq '.[0] | "\(.status) \(.conclusion)"')
          read -r status conclusion <<<"$run"
          echo "CI on $SHA: $status $conclusion"
          case "$status $conclusion" in
            "completed success") ;;
            "null null"|" ") echo "::error::no CI run on main for $SHA: is $TAG on a commit of main?"; exit 1 ;;
            completed*) echo "::error::CI concluded $conclusion on $SHA: run CI again on that commit, then this workflow"; exit 1 ;;
            *) echo "::error::CI is $status on $SHA: wait for it, then run this workflow again"; exit 1 ;;
          esac
      # An environment that does not exist is created without reviewers by
      # the first job that names it, and one that accepts any ref lets a
      # copy of this file on a branch publish: refuse both.
      - name: the registries environment has reviewers and accepts chosen refs only
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          environment=$(gh api "repos/$GH_REPO/environments/registries") \
            || { echo "::error::no environment named registries: see docs/releasing.md"; exit 1; }
          reviewers=$(jq '[.protection_rules[]? | select(.type == "required_reviewers") | .reviewers[]?] | length' <<<"$environment")
          [ "$reviewers" -gt 0 ] || {
            echo "::error::the registries environment has no required reviewers: see docs/releasing.md"; exit 1; }
          [ "$(jq '.deployment_branch_policy != null' <<<"$environment")" = true ] || {
            echo "::error::the registries environment accepts any branch or tag: see docs/releasing.md"; exit 1; }

  # Builds every package from the tag's commit, the one this run is on, with no
  # publishing identity, and asks each registry what it already has.
  packages:
    name: build the packages, ask the registries
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.gate.outputs.version }}
    outputs:
      pypi: ${{ steps.have.outputs.pypi }}
      crates: ${{ steps.have.outputs.crates }}
      npm: ${{ steps.have.outputs.npm }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: the Python wheel and source archive
        run: |
          pip install build==1.6.1 twine==7.0.0
          python -m build --outdir "$RUNNER_TEMP/pypi" sdks/python
          twine check --strict "$RUNNER_TEMP"/pypi/*
          ls "$RUNNER_TEMP/pypi"
          [ -f "$RUNNER_TEMP/pypi/wasmkeep-$VERSION-py3-none-any.whl" ] && [ -f "$RUNNER_TEMP/pypi/wasmkeep-$VERSION.tar.gz" ] \
            || { echo "::error::the build did not produce the wheel and the source archive of $VERSION"; exit 1; }
      - name: the npm tarball
        working-directory: sdks/typescript
        run: |
          mkdir "$RUNNER_TEMP/npm"
          npm pack --pack-destination "$RUNNER_TEMP/npm"
          ls "$RUNNER_TEMP/npm"
          [ -f "$RUNNER_TEMP/npm/wasmkeep-sdk-$VERSION.tgz" ] \
            || { echo "::error::npm pack did not produce wasmkeep-sdk-$VERSION.tgz"; exit 1; }
      # Packages the crate and builds the package, as a registry would
      # receive it: what `cargo publish --no-verify` then uploads.
      - name: the Rust crate, packaged and built
        run: cargo package -p wasmkeep-sdk --locked
      - id: have
        name: what each registry already has
        run: |
          status() { curl -s -o "$2" -w '%{http_code}' -A 'wasmkeep-release-workflow' "$1"; }
          # PyPI: by file, since a version exists as soon as one file does.
          code=$(status "https://pypi.org/pypi/wasmkeep/$VERSION/json" pypi.json)
          case "$code" in
            200) have=$(jq -r '.urls[].filename' pypi.json) ;;
            404) have= ;;
            *) echo "::error::PyPI answered $code"; exit 1 ;;
          esac
          missing=0
          for file in "$RUNNER_TEMP"/pypi/*; do
            if grep -qxF "$(basename "$file")" <<<"$have"; then
              echo "PyPI has $(basename "$file")"; rm "$file"
            else
              missing=$((missing + 1))
            fi
          done
          [ "$missing" -gt 0 ] && echo "pypi=publish" >> "$GITHUB_OUTPUT" || echo "pypi=done" >> "$GITHUB_OUTPUT"
          for registry in crates npm; do
            case "$registry" in
              crates) url="https://crates.io/api/v1/crates/wasmkeep-sdk/$VERSION" ;;
              npm) url="https://registry.npmjs.org/@wasmkeep%2fsdk/$VERSION" ;;
            esac
            code=$(status "$url" /dev/null)
            case "$code" in
              200) echo "$registry has $VERSION"; echo "$registry=done" >> "$GITHUB_OUTPUT" ;;
              404) echo "$registry=publish" >> "$GITHUB_OUTPUT" ;;
              *) echo "::error::$registry answered $code"; exit 1 ;;
            esac
          done
          cat "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: publish-pypi
          path: ${{ runner.temp }}/pypi/
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: publish-npm
          path: ${{ runner.temp }}/npm/*.tgz
          if-no-files-found: error
          retention-days: 7

  pypi:
    name: PyPI (wasmkeep)
    needs: [gate, packages]
    if: needs.packages.outputs.pypi == 'publish'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: registries
    permissions:
      id-token: write # the registry trusts this workflow's identity
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: publish-pypi
          path: dist
      # pypa/gh-action-pypi-publish v1.14.3: uploads what is in dist, the
      # files PyPI does not have yet.
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086
        with:
          packages-dir: dist

  crates:
    name: crates.io (wasmkeep-sdk)
    needs: [gate, packages]
    if: needs.packages.outputs.crates == 'publish'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: registries
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - id: auth
        # rust-lang/crates-io-auth-action v1.0.6: a token for this run only
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9
      # --no-verify: `packages` built the package already, and no build
      # script or macro runs here, where the token is.
      - run: cargo publish -p wasmkeep-sdk --locked --no-verify
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  npm:
    name: npm (@wasmkeep/sdk)
    needs: [gate, packages]
    if: needs.packages.outputs.npm == 'publish'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: registries
    permissions:
      id-token: write
      contents: read
    env:
      VERSION: ${{ needs.gate.outputs.version }}
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: publish-npm
          path: dist
      - name: publish the tarball, with the workflow's identity and a provenance statement
        run: |
          # Publishing without a token needs npm 11.5.1 or later.
          node -e '
            const [a, b, c] = process.argv[1].split(".").map(Number);
            const ok = a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1)));
            if (!ok) { console.error(`::error::npm ${process.argv[1]} cannot publish without a token (11.5.1 or later)`); process.exit(1); }
          ' "$(npm --version)"
          # "./": npm reads a bare "dist/x.tgz" as the GitHub repository
          # dist/x.tgz and tries to clone it.
          npm publish "./dist/wasmkeep-sdk-$VERSION.tgz"

  # The Go module has no registry: its version is a tag of this repository,
  # sdks/go/vX.Y.Z, pushed signed with the release's tag. This checks it is
  # on the release's commit and asks the module proxy for it, so pkg.go.dev
  # shows it at once.
  go:
    name: Go module (its tag, and the proxy)
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      VERSION: ${{ needs.gate.outputs.version }}
      SHA: ${{ needs.gate.outputs.sha }}
      REPO_URL: ${{ github.server_url }}/${{ github.repository }}
    steps:
      - run: |
          tag="sdks/go/v$VERSION"
          # The commit the tag points at: the peeled line of a signed tag.
          at=$(git ls-remote --tags "$REPO_URL" "refs/tags/$tag" "refs/tags/$tag^{}" | sort -k2 | tail -1 | cut -f1)
          [ -n "$at" ] || {
            echo "::error::no tag $tag: push it, signed, on the release's commit (docs/releasing.md), then run this workflow again"; exit 1; }
          [ "$at" = "$SHA" ] || { echo "::error::$tag is on $at, the release is $SHA"; exit 1; }
          url="https://proxy.golang.org/github.com/wasmkeep/wasmkeep/sdks/go/@v/v$VERSION.info"
          code=$(curl -s -o /dev/null -w '%{http_code}' "$url")
          [ "$code" = 200 ] && echo "the proxy has sdks/go v$VERSION" \
            || echo "::warning::the proxy answered $code for sdks/go v$VERSION: if it was asked before the tag existed, it may take half an hour"

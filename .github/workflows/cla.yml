name: CLA

# Asks each contributor to sign CLA.md once, by a comment on their first pull
# request, and records the signature on the cla-signatures branch. It never
# checks out or runs the pull request's code.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

# What the action's code calls (v2.6.1 at the pinned commit): the Actions API
# to re-run the check once a contributor signs (actions: write), the contents
# API to write signatures/cla.json on the cla-signatures branch (contents:
# write), and the pull request and comment APIs to read the PR, comment and
# lock it after the merge (pull-requests: write). It sets no commit status
# (the check is the workflow run itself), so `statuses` is not granted. This
# is the pull_request_target token of the base repository: the action reads
# the pull request through the API and checks no code of it out, and nothing
# here may add a checkout step.
permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  cla:
    # On a pull request, or on a comment that signs or asks for a recheck:
    # any other comment starts no runner.
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
       (github.event.comment.body == 'recheck' ||
        github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # contributor-assistant/github-action v2.6.1
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/cla.json
          path-to-document: https://github.com/WasmKeep/wasmkeep/blob/main/CLA.md
          branch: cla-signatures
          allowlist: jturbide,dependabot[bot]

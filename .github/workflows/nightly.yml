name: nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sim:
    name: simulation (madsim, 20,000 seeds)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      RUSTFLAGS: --cfg madsim
      WASMKEEP_SIM_SEEDS: "20000"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: madsim-release
      - run: cargo test -p wasmkeep-sim --locked --release --target-dir target/madsim

name: nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

# `bash` by name runs every step with `-eo pipefail`: a failure on the left
# of a pipe fails the step.
defaults:
  run:
    shell: bash

jobs:
  sim:
    name: simulation (madsim, 20,000 seeds)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      RUSTFLAGS: --cfg madsim
      WASMKEEP_SIM_SEEDS: "20000"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: madsim-release
      - run: cargo test -p wasmkeep-sim --locked --release --target-dir target/madsim

  # The suite on macOS, which pull requests do not run (ci.yml): pushes to
  # main run it too, and this catches what only shows now and then.
  test-macos:
    name: test (macos-latest)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-nextest
      - run: cargo nextest run --workspace --locked --no-tests=pass

  # The tutorials run as written (scripts/test-tutorials.sh): three nodes
  # against moto, a kill -9, a drain. Minutes of real time, so not on pull
  # requests; a tutorial skipped for a missing tool fails here.
  tutorials:
    name: tutorials (as written)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      WASMKEEP_TUTORIALS_NO_SKIP: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: tutorials
          workspaces: |
            .
            examples/counter
      # The S3 store at the version the page names (the test uses uvx
      # instead when the runner has it).
      - run: pip install --quiet "moto[server]==5.2.5"
      - run: ./scripts/test-tutorials.sh

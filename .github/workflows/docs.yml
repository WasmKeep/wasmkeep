name: docs

# Publishes the docs site (scripts/docs-site.sh) to GitHub Pages at
# https://docs.wasmkeep.dev, from a release's tag: the site shows the docs of
# the latest release, so it matches what users install. It runs when a
# release is published, or by hand with a release tag as `tag` (to publish
# an existing release's docs, or again after a fix to this file).

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (vX.Y.Z)"
        required: true

permissions:
  contents: read

concurrency:
  group: docs-pages
  cancel-in-progress: false

jobs:
  build:
    name: build the site
    timeout-minutes: 10
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: the ref is a release tag
        run: |
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "not a release tag: $TAG" >&2; exit 1 ;;
          esac
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: mdbook@0.5.4
      - name: build (fails on broken links)
        run: ./scripts/docs-site.sh
      - name: the custom domain
        run: echo docs.wasmkeep.dev > target/book/CNAME
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: target/book

  deploy:
    name: deploy to GitHub Pages
    needs: build
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

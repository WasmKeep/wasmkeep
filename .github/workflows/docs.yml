name: docs

# Publishes the docs site (scripts/docs-site.sh) to GitHub Pages at
# https://docs.wasmkeep.dev, from a release's tag: the site shows the docs of
# the latest release, so it matches what users install. It runs when a
# release is published, or by hand with a release tag as `tag` (to publish
# an existing release's docs, or again after a fix to this file).

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (vX.Y.Z)"
        required: true

permissions:
  contents: read

concurrency:
  group: docs-pages
  cancel-in-progress: false

jobs:
  build:
    name: build the site
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      # The copy of this file that runs is the one on the ref it started on:
      # a run by hand on a branch would publish with its own steps. Refuse
      # every ref but a release tag and main, as release.yml does.
      - name: This run is on a release tag or on main
        env:
          REF: ${{ github.ref }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            [[ $REF =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] && exit 0
          elif [ "$REF" = refs/heads/main ]; then
            exit 0
          fi
          echo "::error::run on $REF: start this workflow on a release tag (vX.Y.Z) or on main" >&2
          exit 1
      - name: the ref is a release tag
        run: |
          # vX.Y.Z, or vX.Y.Z-pre.1: nothing after the digits but a
          # pre-release suffix (a glob like v[0-9]*.[0-9]*.[0-9]* took
          # v1.2.3 followed by anything, or a path-like name).
          [[ $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] \
            || { echo "not a release tag: $TAG" >&2; exit 1; }
      # The site is built only from an annotated tag whose signature GitHub
      # verifies (the check release.yml makes before it builds).
      - name: The tag is signed
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ref=$(gh api "repos/$GH_REPO/git/ref/tags/$TAG" --jq '.object | "\(.type) \(.sha)"')
          read -r type object <<<"$ref"
          [ "$type" = tag ] || {
            echo "::error::$TAG is a lightweight tag: tag the release with git tag -s" >&2; exit 1; }
          tag=$(gh api "repos/$GH_REPO/git/tags/$object" \
            --jq '"\(.verification.verified) \(.verification.reason) \(.object.type)"')
          read -r verified reason kind <<<"$tag"
          [ "$kind" = commit ] || {
            echo "::error::$TAG points at a $kind, not a commit" >&2; exit 1; }
          [ "$verified" = true ] || {
            echo "::error::$TAG has no signature GitHub verifies ($reason)" >&2; exit 1; }
          echo "$TAG: signed tag, verified ($reason)"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: mdbook@0.5.4
      - name: build (fails on broken links)
        run: ./scripts/docs-site.sh
      - name: the custom domain
        run: echo docs.wasmkeep.dev > target/book/CNAME
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: target/book

  deploy:
    name: deploy to GitHub Pages
    needs: build
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

name: release

# A tag `vX.Y.Z` (equal to the workspace version) builds the release
# binaries, signs them and opens a draft pre-release with them, once CI has
# passed on the tagged commit (the `ci` job waits for it), its text
# taken from the version's section of CHANGELOG.md; a maintainer reviews and
# publishes it. Run by hand (workflow_dispatch) it builds and
# signs the same files as a workflow artifact, with no release: a dry run.
# A run by hand starts only on a `v*` tag or on `main` (the `ci` job refuses
# any other ref), since it signs and pushes images with this workflow's
# identity.
# A pull request that changes the packaging runs the build jobs alone
# (binaries, example components, SDK archives, images): nothing is signed
# or pushed.
#
# Per target: the binary built against glibc 2.28 (scripts/build-portable.sh),
# its CycloneDX SBOM (scripts/sbom.sh) and the third-party notices
# (scripts/notices.sh), in a tarball with a short README of its own
# (deploy/tarball/README.md). Once for every target: example components
# built for wasm32-wasip2 with their third-party notices (the `components`
# job), so that trying WasmKeep needs no toolchain: the Rust ones, and the
# counter in each other Recommended and Supported language
# (counter-<lang>.wasm: TypeScript, Python, Go, C, Zig); and the C and Zig SDKs
# as archives with their generated bindings, wasmkeep-c-sdk-<version>.tar.gz
# and wasmkeep-zig-sdk-<version>.tar.gz (the `sdks` job,
# scripts/package-c-sdk.sh). SHA256SUMS lists every file, and each file has a
# Sigstore bundle (<file>.sigstore.json) from keyless cosign signing: the
# certificate names this workflow and the ref it ran on (docs/deploy/single-node.md
# says how to verify), and a build provenance attestation (GitHub's) covers
# the same files.
#
# The container image (deploy/Dockerfile, with the third-party notices) is
# built for linux/amd64 and linux/arm64 on native runners, pushed to
# ghcr.io/wasmkeep/wasmkeep by digest, joined into one index and signed
# with keyless cosign: tagged X.Y.Z for a tag, `dev` for a run by hand. A
# pull request builds it without pushing. deploy/compose/README.md says how
# to verify.
#
# The toolchain image (deploy/toolchain/Dockerfile: `wasmkeep` and the
# build tools of every Recommended and Supported SDK) goes the same way, to
# ghcr.io/wasmkeep/toolchain: built on native runners for both platforms,
# pushed by digest, then that pushed image runs deploy/toolchain/test.sh
# (examples/todo-front through `wasmkeep dev`, a counter in each language),
# joined into one index once the binaries are signed, and signed: X.Y.Z
# for a tag, written once, `dev` for a run by hand. A pull request builds
# it and runs the test on it, without pushing. docs/deploy/toolchain.md
# says how to verify and use it.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/build-portable.sh
      - scripts/sbom.sh
      - scripts/notices.sh
      - about.toml
      - about.hbs
      - scripts/release-notes.sh
      - deploy/Dockerfile
      - deploy/toolchain/**
      - .dockerignore
      - deploy/tarball/README.md
      - scripts/package-c-sdk.sh
      - scripts/componentize-core.sh
      - scripts/requirements/**
      - scripts/runtime-notices.sh
      - deploy/notices/**

permissions:
  contents: read

# `bash` by name runs every step with `-eo pipefail`: a failure on the left
# of a pipe fails the step.
defaults:
  run:
    shell: bash

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # A release is built only from a commit CI has passed on. For a tag, this
  # waits for the CI workflow's run on the tagged commit (its push to main)
  # and fails unless it succeeded: run CI again, then this workflow again.
  # Anything else (a dry run, a pull request) passes at once.
  ci:
    name: CI passed on this commit
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      actions: read
    steps:
      # A run by hand signs files and pushes images (`dev`) with this
      # workflow's identity, whatever ref it is started on: a copy of this
      # file on a branch would do the same. Refuse every ref but a release
      # tag and main; the tag ruleset and main's protection (docs/releasing.md)
      # are what keep those two from being created or changed freely.
      - name: A run by hand is on a release tag or on main
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          [ "$EVENT" = workflow_dispatch ] || exit 0
          if [ "$REF_TYPE" = tag ]; then
            [[ $REF =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] && exit 0
          elif [ "$REF" = refs/heads/main ]; then
            exit 0
          fi
          echo "::error::run by hand on $REF: start this workflow on a release tag (vX.Y.Z) or on main"
          exit 1
      - name: Wait for CI on the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REF_TYPE: ${{ github.ref_type }}
          SHA: ${{ github.sha }}
        run: |
          [ "$REF_TYPE" = tag ] || { echo "not a tag: nothing to wait for"; exit 0; }
          for _ in $(seq 160); do
            # The latest full CI run on main for this commit: started by
            # hand (workflow_dispatch) before tagging, or the nightly one.
            # Runs on push are the fast jobs only and do not count. A
            # re-run replaces its conclusion.
            read -r status conclusion < <(gh run list --workflow ci.yml --commit "$SHA" \
              --branch main --limit 20 --json event,status,conclusion \
              --jq '[.[] | select(.event == "workflow_dispatch" or .event == "schedule")][0] | "\(.status) \(.conclusion)"') || true
            echo "CI on $SHA: $status $conclusion"
            if [ "$status" = completed ]; then
              [ "$conclusion" = success ] && exit 0
              echo "::error::CI did not pass on $SHA ($conclusion): run it again, then this workflow"
              exit 1
            fi
            sleep 30
          done
          echo "::error::no finished full CI run on main for $SHA: run gh workflow run ci.yml --ref main on it before tagging"
          exit 1

  # The example components a release carries: the counter of the README's
  # quickstart, and the Rust classes that the key-value, queue and workflow
  # guides have actors in other languages call, with the third-party
  # notices of the crates they link (THIRD_PARTY_NOTICES-components.txt);
  # and the same counter in each other Recommended and Supported language,
  # counter-<lang>.wasm, built with the tools and versions of CI's
  # `languages` job (scripts/check-toolchain.py checks the pins), with the
  # notices of the runtime each embeds appended to that file
  # (scripts/runtime-notices.sh). The Experimental languages (standard Go,
  # D, MoonBit, C#) are not released. Built once: a component is the same
  # file on every platform. The artifact's name starts with `build-`, so
  # the `sign` job takes these files with the binaries.
  components:
    name: example components
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: wasm-tools@1.263.0,wit-bindgen-cli@0.63.0,cargo-about@0.9.3
      # The toolchains of the other languages, as CI's `languages` job
      # installs them (no caches: a release builds from nothing).
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Toolchains (C, Zig, Python)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang lld wasi-libc libclang-rt-18-dev-wasm32
          pip install --require-hashes --only-binary=:all: -r scripts/requirements/languages.txt
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.24.7"
          cache: false
      - name: Toolchains (Go)
        # TinyGo checked by the SHA-256 deploy/toolchain/Dockerfile pins.
        run: |
          curl -sSfL -o "$RUNNER_TEMP/tinygo.tar.gz" https://github.com/tinygo-org/tinygo/releases/download/v0.39.0/tinygo0.39.0.linux-amd64.tar.gz
          echo "a119801579ef0a7a4f3ee285f0caf55241eaa9e115154c2028b696770b47a846  $RUNNER_TEMP/tinygo.tar.gz" | sha256sum -c
          tar xzf "$RUNNER_TEMP/tinygo.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/tinygo/bin" >> "$GITHUB_PATH"
      - name: The Rust components, with the pinned toolchain, validated, named; their notices
        run: |
          # The file in the release, the example's directory, the file
          # cargo writes there. `counter` is the default build (no feature).
          components='
            counter.wasm           counter           counter
            kv.wasm                jobs/kv           jobs_kv
            queue.wasm             jobs/queue        jobs_queue
            workflows-orders.wasm  workflows/orders  workflows_orders
            workflows-ledger.wasm  workflows/ledger  workflows_ledger
          '
          # rustup installs what rust-toolchain.toml names, target included,
          # on first use: check that this is the compiler that answers.
          pinned=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          rustc -V
          [ -n "$pinned" ] && [ "$(rustc -V | cut -d' ' -f2)" = "$pinned" ] \
            || { echo "::error::rustc is not the pinned toolchain ($pinned)"; exit 1; }
          mkdir dist
          while read -r file dir built; do
            [ -n "$file" ] || continue
            echo "::group::$file (examples/$dir)"
            (cd "examples/$dir" && cargo build --release --target wasm32-wasip2 --locked)
            wasm=examples/$dir/target/wasm32-wasip2/release/$built.wasm
            wasm-tools validate "$wasm"
            wasm-tools component targets crates/wasmkeep-wit/wit --world actor "$wasm"
            install -m 0644 "$wasm" "dist/$file"
            echo "::endgroup::"
          done <<<"$components"
          # They link the Rust SDK's dependencies: one file with those
          # crates' notices travels with them (docs/legal.md).
          mapfile -t dirs < <(awk 'NF { print "examples/" $2 }' <<<"$components")
          ./scripts/notices.sh --components dist/THIRD_PARTY_NOTICES-components.txt "${dirs[@]}"
      - name: The counter in the other languages, validated, named
        run: |
          # The file in the release, then the example's directory: each
          # build writes counter.wasm there. TypeScript: the default engine
          # (QuickJS-ng) only, not StarlingMonkey (MPL-2.0, docs/legal.md).
          counters='
            counter-typescript.wasm  ts-counter
            counter-python.wasm      py-counter
            counter-go.wasm          go-counter
            counter-c.wasm           c-counter
            counter-zig.wasm         zig-counter
          '
          (cd sdks/typescript && npm ci)
          while read -r file dir; do
            [ -n "$file" ] || continue
            echo "::group::$file (examples/$dir)"
            rm -f "examples/$dir/counter.wasm"
            case $dir in
              ts-counter) (cd examples/ts-counter && npm ci && npm run build) ;;
              zig-counter) ZIG="python -m ziglang" examples/zig-counter/build.sh ;;
              *) "examples/$dir/build.sh" ;;
            esac
            wasm=examples/$dir/counter.wasm
            # Valid components; not checked against the actor world, as in
            # CI: a QuickJS or CPython component imports more of WASI than
            # the world, which the host links.
            wasm-tools validate "$wasm"
            install -m 0644 "$wasm" "dist/$file"
            echo "::endgroup::"
          done <<<"$counters"
          # The runtimes they embed (QuickJS-ng, CPython, TinyGo, wasi-libc,
          # Zig's library, the WASI adapter): their notices, in the same file.
          ./scripts/runtime-notices.sh dist/THIRD_PARTY_NOTICES-components.txt
          [ "$(ls dist/*.wasm | wc -l)" = 10 ] || { echo "::error::expected ten components"; ls dist; exit 1; }
          ls -l dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: build-components
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  # The C SDK, and the Zig SDK over it, as archives with the bindings
  # `wit-bindgen c` generates (users need no wit-bindgen), each checked as a
  # user gets it: extracted into an empty directory, the counter built with
  # the README's commands, wit-bindgen made to fail. The artifact's name
  # starts with `build-`, so the `sign` job takes these files too.
  sdks:
    name: C and Zig SDK archives
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: wasm-tools@1.263.0,wit-bindgen-cli@0.63.0
      # A Python of its own for pip (Zig comes as the ziglang package, as in CI).
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Toolchains (C, Zig)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang lld wasi-libc libclang-rt-18-dev-wasm32
          pip install --require-hashes --only-binary=:all: -r scripts/requirements/languages.txt
      - name: Package and build the counter from each archive
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          # The same label as the binaries' (the `build` job checks the tag).
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "$REF_TYPE" = tag ]; then
            label=$version
            ref=$REF_NAME
          else
            label=$version-dev.$(git rev-parse --short=12 HEAD)
            ref=$(git rev-parse HEAD)
          fi
          ZIG="python -m ziglang" ./scripts/package-c-sdk.sh dist "$label" "$ref"
          ls -l dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: build-sdks
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  build:
    name: build (${{ matrix.target }})
    needs: ci
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Version (a tag must equal the workspace version)
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "$REF_TYPE" = tag ]; then
            if [ "$REF_NAME" != "v$version" ]; then
              echo "::error::tag $REF_NAME does not match the workspace version $version"
              exit 1
            fi
            label=$version
          else
            label=$version-dev.$(git rev-parse --short=12 HEAD)
          fi
          echo "LABEL=$label" >> "$GITHUB_ENV"
      - name: Versions (every SDK manifest equals the workspace version, so the tag)
        run: python3 -I scripts/check-versions.py
      - name: Release notes (a tag needs its section in CHANGELOG.md)
        env:
          REF_TYPE: ${{ github.ref_type }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          ./scripts/release-notes.sh "$version" > notes.md || true
          if [ -s notes.md ]; then
            cat notes.md
          elif [ "$REF_TYPE" = tag ]; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          else
            echo "::warning::CHANGELOG.md has no section for $version yet"
          fi
      - name: Check the host matches the target
        run: |
          [ "$(uname -m)-unknown-linux-gnu" = "$TARGET" ] \
            || { echo "::error::runner is $(uname -m), target is $TARGET"; exit 1; }
      - name: Build against glibc 2.28 (AlmaLinux 8 container)
        run: ./scripts/build-portable.sh glibc
      - name: The binary needs glibc 2.28 at most, and runs
        run: |
          bin=target/portable/glibc/release/wasmkeep
          newest=$(objdump -T "$bin" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)
          echo "newest glibc symbol: $newest"
          [ -n "$newest" ] || { echo "::error::no glibc symbol read from $bin"; exit 1; }
          [ "$(printf '%s\n' "$newest" GLIBC_2.28 | sort -V | tail -1)" = GLIBC_2.28 ] \
            || { echo "::error::$bin needs $newest, newer than GLIBC_2.28"; exit 1; }
          "$bin" --version
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-cyclonedx@0.5.9,cargo-about@0.9.3
      - name: SBOM and third-party notices
        run: |
          ./scripts/sbom.sh "$TARGET"
          ./scripts/notices.sh
      - name: Package
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          name=wasmkeep-$LABEL-$TARGET
          mkdir -p "dist/$name"
          install -m 0755 target/portable/glibc/release/wasmkeep "dist/$name/wasmkeep"
          install -m 0644 LICENSE NOTICE target/notices/THIRD_PARTY_NOTICES.txt "dist/$name/"
          # The tarball's own README, not the repository's: its links are
          # absolute, to the files of the commit this binary was built from.
          [ "$REF_TYPE" = tag ] && ref=$REF_NAME || ref=$(git rev-parse HEAD)
          sed -e "s/@VERSION@/$LABEL/g" -e "s/@REF@/$ref/g" deploy/tarball/README.md > "dist/$name/README.md"
          # A tarball resolves no relative link, and no placeholder stays.
          if grep -nP '@[A-Z]+@|\]\((?!https://)' "dist/$name/README.md"; then
            echo "::error::deploy/tarball/README.md: a placeholder left, or a link that is not absolute"
            exit 1
          fi
          chmod 0644 "dist/$name/README.md"
          epoch=$(git log -1 --format=%ct)
          tar --sort=name --mtime="@$epoch" --owner=0 --group=0 --numeric-owner --mode=go-w \
            -C dist -cf - "$name" | gzip -n -9 > "dist/$name.tar.gz"
          cp "target/sbom/wasmkeep-$TARGET.cdx.json" "dist/$name.cdx.json"
          rm -r "dist/$name"
          ls -l dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: build-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  sign:
    name: checksums and signatures
    # Every job whose files this one signs.
    needs: [build, components, sdks]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      id-token: write       # keyless signing and attestation: the workflow's OIDC identity
      attestations: write   # the build provenance of the files
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: build-*
          path: dist
          merge-multiple: true
      - name: SHA256SUMS
        working-directory: dist
        run: |
          # Per target a tarball and its SBOM; ten components and their
          # notices; the C and Zig SDK archives: 17 files, then SHA256SUMS,
          # each with a bundle (36 assets in the release).
          ls -l
          [ "$(ls | wc -l)" = 17 ] || { echo "::error::expected 17 files to sign, found $(ls | wc -l)"; exit 1; }
          sha256sum -- * | tee SHA256SUMS
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign every file (keyless, Sigstore bundle per file)
        working-directory: dist
        run: |
          for f in *; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done
      - name: Verify every signature as a user would
        working-directory: dist
        env:
          IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}
        run: |
          for f in *; do
            case $f in *.sigstore.json) continue ;; esac
            cosign verify-blob --bundle "$f.sigstore.json" \
              --certificate-identity "$IDENTITY" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com "$f"
          done
          sha256sum --check SHA256SUMS
      # A GitHub build provenance attestation for every file SHA256SUMS lists,
      # beside the Sigstore bundles: `gh attestation verify <file> --repo
      # WasmKeep/wasmkeep` checks it.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: draft pre-release
    needs: sign
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write   # the draft release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          sparse-checkout: |
            CHANGELOG.md
            scripts/release-notes.sh
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release
          path: dist
      - name: Create the draft, or replace its files on a re-run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          ./scripts/release-notes.sh "${TAG#v}" > notes.md
          [ -s notes.md ] || { echo "::error::CHANGELOG.md has no section for ${TAG#v}"; exit 1; }
          if draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            # Never replace the files of a published release.
            [ "$draft" = true ] || { echo "::error::release $TAG is already published"; exit 1; }
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" dist/* --draft --prerelease --verify-tag \
              --title "WasmKeep $TAG" --notes-file notes.md
          fi

  image-build:
    name: image (${{ matrix.platform }})
    needs: ci
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write   # push by digest (not on pull requests)
    env:
      PLATFORM: ${{ matrix.platform }}
      PUSH: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-about@0.9.3
      - name: Third-party notices for the image
        run: ./scripts/notices.sh
      - name: BuildKit builder
        run: docker buildx create --use --name wasmkeep --driver docker-container
      - name: Build, and check the image runs
        run: |
          docker buildx build -f deploy/Dockerfile --platform "$PLATFORM" \
            --build-context notices=target/notices --provenance=false --sbom=false \
            --load -t wasmkeep:test .
          docker run --rm wasmkeep:test --version
      - name: The documented local build (no notices context) still works
        run: docker buildx build -f deploy/Dockerfile --platform "$PLATFORM" --provenance=false .
      - name: Push by digest
        if: env.PUSH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: |
          image=ghcr.io/${GITHUB_REPOSITORY,,}
          echo "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          docker buildx build -f deploy/Dockerfile --platform "$PLATFORM" \
            --build-context notices=target/notices --provenance=false --sbom=false \
            --output "type=image,name=$image,push-by-digest=true,name-canonical=true,push=true" \
            --metadata-file meta.json .
          digest=$(jq -r '."containerimage.digest"' meta.json)
          echo "pushed $image@$digest"
          mkdir -p digests && touch "digests/${digest#sha256:}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: env.PUSH == 'true'
        with:
          name: image-digest-${{ matrix.runner }}
          path: digests/*
          if-no-files-found: error
          retention-days: 1

  image:
    name: image index and signature
    # After the binaries are signed: the image is not public before them.
    needs: [image-build, sign]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      packages: write   # the index and its signature
      id-token: write   # keyless signing: the workflow's OIDC identity
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: image-digest-*
          path: digests
          merge-multiple: true
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: One index for both platforms, signed and verified
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}
        run: |
          image=ghcr.io/${GITHUB_REPOSITORY,,}
          if [ "$REF_TYPE" = tag ]; then tag=${REF_NAME#v}; else tag=dev; fi
          [ "$(ls digests | wc -l)" = 2 ] || { echo "::error::expected two platform digests"; ls digests; exit 1; }
          echo "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          # A version's tag is written once: a second run of a tag's workflow
          # must not point X.Y.Z at another image. (`dev` moves.)
          if [ "$REF_TYPE" = tag ] && docker buildx imagetools inspect "$image:$tag" > /dev/null 2>&1; then
            echo "::error::$image:$tag exists already: a published version's image is not replaced (delete the tag by hand if it never was released)"
            exit 1
          fi
          docker buildx imagetools create -t "$image:$tag" $(printf "$image@sha256:%s " $(ls digests))
          digest=$(docker buildx imagetools inspect "$image:$tag" --format '{{json .Manifest}}' | jq -r .digest)
          docker buildx imagetools inspect "$image@$digest"
          cosign sign --yes "$image@$digest"
          cosign verify "$image@$digest" --certificate-identity "$IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
          echo "### Image" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$image:$tag\` = \`$image@$digest\` (signed)" >> "$GITHUB_STEP_SUMMARY"

  # The toolchain image, per platform: like image-build, but the image a
  # release pushes is the image tested: built and pushed by digest, then
  # pulled by that digest and run on deploy/toolchain/test.sh. A pull
  # request tests the image it built, and pushes nothing. Its digests go
  # in artifacts of their own (`toolchain-digest-*`): the `image` job
  # counts the `image-digest-*` ones.
  toolchain-build:
    name: toolchain image (${{ matrix.platform }})
    needs: ci
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write   # push by digest (not on pull requests)
    env:
      PLATFORM: ${{ matrix.platform }}
      PUSH: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-about@0.9.3
      - name: Third-party notices for the image
        run: ./scripts/notices.sh
      - name: The pins are the ones CI builds the examples with
        run: python3 -I scripts/check-toolchain.py
      - name: BuildKit builder
        run: docker buildx create --use --name wasmkeep --driver docker-container
      - name: Build, push by digest (not on pull requests), and test the image
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: |
          image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/toolchain
          build=(docker buildx build -f deploy/toolchain/Dockerfile --platform "$PLATFORM"
            --build-context notices=target/notices --provenance=false --sbom=false)
          if [ "$PUSH" = true ]; then
            echo "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
            "${build[@]}" --metadata-file meta.json \
              --output "type=image,name=$image,push-by-digest=true,name-canonical=true,push=true" .
            digest=$(jq -r '."containerimage.digest"' meta.json)
            echo "pushed $image@$digest"
            mkdir -p digests && touch "digests/${digest#sha256:}"
            tested=$image@$digest
          else
            "${build[@]}" --load -t wasmkeep-toolchain:test .
            tested=wasmkeep-toolchain:test
          fi
          docker run --rm --platform "$PLATFORM" -v "$PWD:/src:ro" "$tested" deploy/toolchain/test.sh
          size=$(docker image inspect "$tested" --format '{{.Size}}')
          echo "### Toolchain image ($PLATFORM)" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$tested\`: $((size / 1000000)) MB uncompressed, tested" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: env.PUSH == 'true'
        with:
          name: toolchain-digest-${{ matrix.runner }}
          path: digests/*
          if-no-files-found: error
          retention-days: 1

  toolchain:
    name: toolchain image index and signature
    # After the binaries are signed, as the server image.
    needs: [toolchain-build, sign]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      packages: write   # the index and its signature
      id-token: write   # keyless signing: the workflow's OIDC identity
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: toolchain-digest-*
          path: digests
          merge-multiple: true
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: One index for both platforms, signed and verified
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}
        run: |
          image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/toolchain
          if [ "$REF_TYPE" = tag ]; then tag=${REF_NAME#v}; else tag=dev; fi
          [ "$(ls digests | wc -l)" = 2 ] || { echo "::error::expected two platform digests"; ls digests; exit 1; }
          echo "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          # Written once, as the server image's version tag.
          if [ "$REF_TYPE" = tag ] && docker buildx imagetools inspect "$image:$tag" > /dev/null 2>&1; then
            echo "::error::$image:$tag exists already: a published version's image is not replaced (delete the tag by hand if it never was released)"
            exit 1
          fi
          docker buildx imagetools create -t "$image:$tag" $(printf "$image@sha256:%s " $(ls digests))
          digest=$(docker buildx imagetools inspect "$image:$tag" --format '{{json .Manifest}}' | jq -r .digest)
          docker buildx imagetools inspect "$image@$digest"
          cosign sign --yes "$image@$digest"
          cosign verify "$image@$digest" --certificate-identity "$IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
          echo "### Toolchain image" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$image:$tag\` = \`$image@$digest\` (signed)" >> "$GITHUB_STEP_SUMMARY"

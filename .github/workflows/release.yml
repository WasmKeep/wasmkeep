name: release

# A tag `vX.Y.Z` (equal to the workspace version) builds the release
# binaries, signs them and opens a draft pre-release with them; a maintainer
# reviews and publishes it. Run by hand (workflow_dispatch) it builds and
# signs the same files as a workflow artifact, with no release: a dry run.
# A pull request that changes the packaging runs the build job alone.
#
# Per target: the binary built against glibc 2.28 (scripts/build-portable.sh),
# its CycloneDX SBOM (scripts/sbom.sh) and the third-party notices
# (scripts/notices.sh). SHA256SUMS lists every file, and each file has a
# Sigstore bundle (<file>.sigstore.json) from keyless cosign signing: the
# certificate names this workflow and the ref it ran on. docs/deploy/single-node.md
# says how to verify.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/build-portable.sh
      - scripts/sbom.sh
      - scripts/notices.sh
      - about.toml
      - about.hbs
      - Cargo.lock

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Version (a tag must equal the workspace version)
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "$REF_TYPE" = tag ]; then
            if [ "$REF_NAME" != "v$version" ]; then
              echo "::error::tag $REF_NAME does not match the workspace version $version"
              exit 1
            fi
            label=$version
          else
            label=$version-dev.$(git rev-parse --short=12 HEAD)
          fi
          echo "LABEL=$label" >> "$GITHUB_ENV"
      - name: Check the host matches the target
        run: |
          [ "$(uname -m)-unknown-linux-gnu" = "$TARGET" ] \
            || { echo "::error::runner is $(uname -m), target is $TARGET"; exit 1; }
      - name: Build against glibc 2.28 (AlmaLinux 8 container)
        run: ./scripts/build-portable.sh glibc
      - name: The binary needs glibc 2.28 at most, and runs
        run: |
          bin=target/portable/glibc/release/wasmkeep
          newest=$(objdump -T "$bin" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)
          echo "newest glibc symbol: $newest"
          [ "$(printf '%s\n' "$newest" GLIBC_2.28 | sort -V | tail -1)" = GLIBC_2.28 ] \
            || { echo "::error::$bin needs $newest, newer than GLIBC_2.28"; exit 1; }
          "$bin" --version
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-cyclonedx@0.5.9,cargo-about@0.9.3
      - name: SBOM and third-party notices
        run: |
          ./scripts/sbom.sh "$TARGET"
          ./scripts/notices.sh
      - name: Package
        run: |
          name=wasmkeep-$LABEL-$TARGET
          mkdir -p "dist/$name"
          install -m 0755 target/portable/glibc/release/wasmkeep "dist/$name/wasmkeep"
          install -m 0644 LICENSE NOTICE README.md target/notices/THIRD_PARTY_NOTICES.txt "dist/$name/"
          epoch=$(git log -1 --format=%ct)
          tar --sort=name --mtime="@$epoch" --owner=0 --group=0 --numeric-owner --mode=go-w \
            -C dist -cf - "$name" | gzip -n -9 > "dist/$name.tar.gz"
          cp "target/sbom/wasmkeep-$TARGET.cdx.json" "dist/$name.cdx.json"
          rm -r "dist/$name"
          ls -l dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: build-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  sign:
    name: checksums and signatures
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      id-token: write   # keyless signing: the workflow's OIDC identity
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: build-*
          path: dist
          merge-multiple: true
      - name: SHA256SUMS
        working-directory: dist
        run: |
          sha256sum -- * | tee SHA256SUMS
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign every file (keyless, Sigstore bundle per file)
        working-directory: dist
        run: |
          for f in *; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done
      - name: Verify every signature as a user would
        working-directory: dist
        env:
          IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}
        run: |
          for f in *; do
            case $f in *.sigstore.json) continue ;; esac
            cosign verify-blob --bundle "$f.sigstore.json" \
              --certificate-identity "$IDENTITY" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com "$f"
          done
          sha256sum --check SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: draft pre-release
    needs: sign
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write   # the draft release
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release
          path: dist
      - name: Create the draft, or replace its files on a re-run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            # Never replace the files of a published release.
            [ "$draft" = true ] || { echo "::error::release $TAG is already published"; exit 1; }
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --draft --prerelease --verify-tag \
              --title "WasmKeep $TAG" \
              --notes "Binaries for x86_64 and aarch64 Linux (glibc 2.28 or newer), each with its SBOM and third-party notices. Verify with the Sigstore bundles: see docs/deploy/single-node.md."
          fi

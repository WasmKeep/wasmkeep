name: release

# A tag `vX.Y.Z` (equal to the workspace version) builds the release
# binaries, signs them and opens a draft pre-release with them, once CI has
# passed on the tagged commit (the `ci` job waits for it), its text
# taken from the version's section of CHANGELOG.md; a maintainer reviews and
# publishes it. Run by hand (workflow_dispatch) it builds and
# signs the same files as a workflow artifact, with no release: a dry run.
# A pull request that changes the packaging runs the build jobs alone
# (binaries, example components, images): nothing is signed or pushed.
#
# Per target: the binary built against glibc 2.28 (scripts/build-portable.sh),
# its CycloneDX SBOM (scripts/sbom.sh) and the third-party notices
# (scripts/notices.sh), in a tarball with a short README of its own
# (deploy/tarball/README.md). Once for every target: example components
# built for wasm32-wasip2 with their third-party notices (the `components`
# job), so that trying WasmKeep needs no toolchain. SHA256SUMS lists every file, and each file has a
# Sigstore bundle (<file>.sigstore.json) from keyless cosign signing: the
# certificate names this workflow and the ref it ran on. docs/deploy/single-node.md
# says how to verify.
#
# The container image (deploy/Dockerfile, with the third-party notices) is
# built for linux/amd64 and linux/arm64 on native runners, pushed to
# ghcr.io/wasmkeep/wasmkeep by digest, joined into one index and signed
# with keyless cosign: tagged X.Y.Z for a tag, `dev` for a run by hand. A
# pull request builds it without pushing. deploy/compose/README.md says how
# to verify.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/build-portable.sh
      - scripts/sbom.sh
      - scripts/notices.sh
      - about.toml
      - about.hbs
      - Cargo.lock
      - scripts/release-notes.sh
      - deploy/Dockerfile
      - .dockerignore
      - deploy/tarball/README.md

permissions:
  contents: read

# `bash` by name runs every step with `-eo pipefail`: a failure on the left
# of a pipe fails the step.
defaults:
  run:
    shell: bash

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # A release is built only from a commit CI has passed on. For a tag, this
  # waits for the CI workflow's run on the tagged commit (its push to main)
  # and fails unless it succeeded: run CI again, then this workflow again.
  # Anything else (a dry run, a pull request) passes at once.
  ci:
    name: CI passed on this commit
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      actions: read
    steps:
      - name: Wait for CI on the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REF_TYPE: ${{ github.ref_type }}
          SHA: ${{ github.sha }}
        run: |
          [ "$REF_TYPE" = tag ] || { echo "not a tag: nothing to wait for"; exit 0; }
          for _ in $(seq 160); do
            # The latest CI run on main for this commit (a re-run replaces
            # its conclusion).
            read -r status conclusion < <(gh run list --workflow ci.yml --commit "$SHA" \
              --branch main --event push --limit 1 --json status,conclusion \
              --jq '.[0] | "\(.status) \(.conclusion)"') || true
            echo "CI on $SHA: $status $conclusion"
            if [ "$status" = completed ]; then
              [ "$conclusion" = success ] && exit 0
              echo "::error::CI did not pass on $SHA ($conclusion): run it again, then this workflow"
              exit 1
            fi
            sleep 30
          done
          echo "::error::no finished CI run on main for $SHA: a release tag belongs on a commit of main"
          exit 1

  # The example components a release carries: the counter of the README's
  # quickstart, and the Rust classes that the key-value, queue and workflow
  # guides have actors in other languages call, with the third-party
  # notices of the crates they link (THIRD_PARTY_NOTICES-components.txt).
  # Built once: a component is the same file on every platform. The
  # artifact's name starts with `build-`, so the `sign` job takes these
  # files with the binaries.
  components:
    name: example components
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: wasm-tools@1.263.0,cargo-about@0.9.3
      - name: Build with the pinned toolchain, validate, name; their notices
        run: |
          # The file in the release, the example's directory, the file
          # cargo writes there. `counter` is the default build (no feature).
          components='
            counter.wasm           counter           counter
            kv.wasm                jobs/kv           jobs_kv
            queue.wasm             jobs/queue        jobs_queue
            workflows-orders.wasm  workflows/orders  workflows_orders
            workflows-ledger.wasm  workflows/ledger  workflows_ledger
          '
          # rustup installs what rust-toolchain.toml names, target included,
          # on first use: check that this is the compiler that answers.
          pinned=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          rustc -V
          [ -n "$pinned" ] && [ "$(rustc -V | cut -d' ' -f2)" = "$pinned" ] \
            || { echo "::error::rustc is not the pinned toolchain ($pinned)"; exit 1; }
          mkdir dist
          while read -r file dir built; do
            [ -n "$file" ] || continue
            echo "::group::$file (examples/$dir)"
            (cd "examples/$dir" && cargo build --release --target wasm32-wasip2 --locked)
            wasm=examples/$dir/target/wasm32-wasip2/release/$built.wasm
            wasm-tools validate "$wasm"
            wasm-tools component targets crates/wasmkeep-wit/wit --world actor "$wasm"
            install -m 0644 "$wasm" "dist/$file"
            echo "::endgroup::"
          done <<<"$components"
          [ "$(ls dist/*.wasm | wc -l)" = 5 ] || { echo "::error::expected five components"; ls dist; exit 1; }
          # They link the Rust SDK's dependencies: one file with those
          # crates' notices travels with them (docs/legal.md).
          mapfile -t dirs < <(awk 'NF { print "examples/" $2 }' <<<"$components")
          ./scripts/notices.sh --components dist/THIRD_PARTY_NOTICES-components.txt "${dirs[@]}"
          ls -l dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: build-components
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  build:
    name: build (${{ matrix.target }})
    needs: ci
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Version (a tag must equal the workspace version)
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "$REF_TYPE" = tag ]; then
            if [ "$REF_NAME" != "v$version" ]; then
              echo "::error::tag $REF_NAME does not match the workspace version $version"
              exit 1
            fi
            label=$version
          else
            label=$version-dev.$(git rev-parse --short=12 HEAD)
          fi
          echo "LABEL=$label" >> "$GITHUB_ENV"
      - name: Versions (every SDK manifest equals the workspace version, so the tag)
        run: python3 -I scripts/check-versions.py
      - name: Release notes (a tag needs its section in CHANGELOG.md)
        env:
          REF_TYPE: ${{ github.ref_type }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          ./scripts/release-notes.sh "$version" > notes.md || true
          if [ -s notes.md ]; then
            cat notes.md
          elif [ "$REF_TYPE" = tag ]; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          else
            echo "::warning::CHANGELOG.md has no section for $version yet"
          fi
      - name: Check the host matches the target
        run: |
          [ "$(uname -m)-unknown-linux-gnu" = "$TARGET" ] \
            || { echo "::error::runner is $(uname -m), target is $TARGET"; exit 1; }
      - name: Build against glibc 2.28 (AlmaLinux 8 container)
        run: ./scripts/build-portable.sh glibc
      - name: The binary needs glibc 2.28 at most, and runs
        run: |
          bin=target/portable/glibc/release/wasmkeep
          newest=$(objdump -T "$bin" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)
          echo "newest glibc symbol: $newest"
          [ -n "$newest" ] || { echo "::error::no glibc symbol read from $bin"; exit 1; }
          [ "$(printf '%s\n' "$newest" GLIBC_2.28 | sort -V | tail -1)" = GLIBC_2.28 ] \
            || { echo "::error::$bin needs $newest, newer than GLIBC_2.28"; exit 1; }
          "$bin" --version
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-cyclonedx@0.5.9,cargo-about@0.9.3
      - name: SBOM and third-party notices
        run: |
          ./scripts/sbom.sh "$TARGET"
          ./scripts/notices.sh
      - name: Package
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          name=wasmkeep-$LABEL-$TARGET
          mkdir -p "dist/$name"
          install -m 0755 target/portable/glibc/release/wasmkeep "dist/$name/wasmkeep"
          install -m 0644 LICENSE NOTICE target/notices/THIRD_PARTY_NOTICES.txt "dist/$name/"
          # The tarball's own README, not the repository's: its links are
          # absolute, to the files of the commit this binary was built from.
          [ "$REF_TYPE" = tag ] && ref=$REF_NAME || ref=$(git rev-parse HEAD)
          sed -e "s/@VERSION@/$LABEL/g" -e "s/@REF@/$ref/g" deploy/tarball/README.md > "dist/$name/README.md"
          # A tarball resolves no relative link, and no placeholder stays.
          if grep -nP '@[A-Z]+@|\]\((?!https://)' "dist/$name/README.md"; then
            echo "::error::deploy/tarball/README.md: a placeholder left, or a link that is not absolute"
            exit 1
          fi
          chmod 0644 "dist/$name/README.md"
          epoch=$(git log -1 --format=%ct)
          tar --sort=name --mtime="@$epoch" --owner=0 --group=0 --numeric-owner --mode=go-w \
            -C dist -cf - "$name" | gzip -n -9 > "dist/$name.tar.gz"
          cp "target/sbom/wasmkeep-$TARGET.cdx.json" "dist/$name.cdx.json"
          rm -r "dist/$name"
          ls -l dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: build-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  sign:
    name: checksums and signatures
    # `build` needs `components`; named here too, since this job signs
    # that job's files.
    needs: [build, components]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      id-token: write   # keyless signing: the workflow's OIDC identity
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: build-*
          path: dist
          merge-multiple: true
      - name: SHA256SUMS
        working-directory: dist
        run: |
          sha256sum -- * | tee SHA256SUMS
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign every file (keyless, Sigstore bundle per file)
        working-directory: dist
        run: |
          for f in *; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done
      - name: Verify every signature as a user would
        working-directory: dist
        env:
          IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}
        run: |
          for f in *; do
            case $f in *.sigstore.json) continue ;; esac
            cosign verify-blob --bundle "$f.sigstore.json" \
              --certificate-identity "$IDENTITY" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com "$f"
          done
          sha256sum --check SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: draft pre-release
    needs: sign
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write   # the draft release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          sparse-checkout: |
            CHANGELOG.md
            scripts/release-notes.sh
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release
          path: dist
      - name: Create the draft, or replace its files on a re-run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          ./scripts/release-notes.sh "${TAG#v}" > notes.md
          [ -s notes.md ] || { echo "::error::CHANGELOG.md has no section for ${TAG#v}"; exit 1; }
          if draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            # Never replace the files of a published release.
            [ "$draft" = true ] || { echo "::error::release $TAG is already published"; exit 1; }
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" dist/* --draft --prerelease --verify-tag \
              --title "WasmKeep $TAG" --notes-file notes.md
          fi

  image-build:
    name: image (${{ matrix.platform }})
    needs: ci
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write   # push by digest (not on pull requests)
    env:
      PLATFORM: ${{ matrix.platform }}
      PUSH: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-about@0.9.3
      - name: Third-party notices for the image
        run: ./scripts/notices.sh
      - name: BuildKit builder
        run: docker buildx create --use --name wasmkeep --driver docker-container
      - name: Build, and check the image runs
        run: |
          docker buildx build -f deploy/Dockerfile --platform "$PLATFORM" \
            --build-context notices=target/notices --provenance=false --sbom=false \
            --load -t wasmkeep:test .
          docker run --rm wasmkeep:test --version
      - name: The documented local build (no notices context) still works
        run: docker buildx build -f deploy/Dockerfile --platform "$PLATFORM" --provenance=false .
      - name: Push by digest
        if: env.PUSH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: |
          image=ghcr.io/${GITHUB_REPOSITORY,,}
          echo "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          docker buildx build -f deploy/Dockerfile --platform "$PLATFORM" \
            --build-context notices=target/notices --provenance=false --sbom=false \
            --output "type=image,name=$image,push-by-digest=true,name-canonical=true,push=true" \
            --metadata-file meta.json .
          digest=$(jq -r '."containerimage.digest"' meta.json)
          echo "pushed $image@$digest"
          mkdir -p digests && touch "digests/${digest#sha256:}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: env.PUSH == 'true'
        with:
          name: image-digest-${{ matrix.runner }}
          path: digests/*
          if-no-files-found: error
          retention-days: 1

  image:
    name: image index and signature
    # After the binaries are signed: the image is not public before them.
    needs: [image-build, sign]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      packages: write   # the index and its signature
      id-token: write   # keyless signing: the workflow's OIDC identity
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: image-digest-*
          path: digests
          merge-multiple: true
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: One index for both platforms, signed and verified
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}
        run: |
          image=ghcr.io/${GITHUB_REPOSITORY,,}
          if [ "$REF_TYPE" = tag ]; then tag=${REF_NAME#v}; else tag=dev; fi
          [ "$(ls digests | wc -l)" = 2 ] || { echo "::error::expected two platform digests"; ls digests; exit 1; }
          echo "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          # A version's tag is written once: a second run of a tag's workflow
          # must not point X.Y.Z at another image. (`dev` moves.)
          if [ "$REF_TYPE" = tag ] && docker buildx imagetools inspect "$image:$tag" > /dev/null 2>&1; then
            echo "::error::$image:$tag exists already: a published version's image is not replaced (delete the tag by hand if it never was released)"
            exit 1
          fi
          docker buildx imagetools create -t "$image:$tag" $(printf "$image@sha256:%s " $(ls digests))
          digest=$(docker buildx imagetools inspect "$image:$tag" --format '{{json .Manifest}}' | jq -r .digest)
          docker buildx imagetools inspect "$image@$digest"
          cosign sign --yes "$image@$digest"
          cosign verify "$image@$digest" --certificate-identity "$IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
          echo "### Image" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$image:$tag\` = \`$image@$digest\` (signed)" >> "$GITHUB_STEP_SUMMARY"

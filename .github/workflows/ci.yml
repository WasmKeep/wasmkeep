name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# `bash` by name runs every step with `-eo pipefail`: a failure on the left
# of a pipe fails the step.
defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: cargo fmt --all --check

  benchmark-publication:
    name: benchmark publication paths
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - run: python3 -I scripts/test_check_benchmark_paths.py
      - run: python3 -I scripts/test_bench_ab.py
      - name: CHANGELOG.md has a section for the workspace version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          [ -n "$(./scripts/release-notes.sh "$version")" ] \
            || { echo "::error::CHANGELOG.md has no section for $version"; exit 1; }
      - name: Check every introduced commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ]; then
            python3 -I scripts/check-benchmark-paths.py --range "$BASE_SHA..HEAD"
          elif [ "${{ github.event_name }}" = push ]; then
            # A new branch or the first push: no base, so check the whole
            # history: each root commit's tree, then every commit after it.
            for root in $(git rev-list --max-parents=0 HEAD); do
              python3 -I scripts/check-benchmark-paths.py --rev "$root"
              if [ "$root" != "$(git rev-parse HEAD)" ]; then
                python3 -I scripts/check-benchmark-paths.py --range "$root..HEAD"
              fi
            done
          else
            echo "::error::Cannot determine the base commit; refusing a final-tree-only publication check."
            exit 2
          fi

  licenses:
    name: dependency licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: ./scripts/licenses.sh > THIRD_PARTY_LICENSES.md

  deny:
    name: cargo-deny (advisories, licenses, sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-nextest
      - run: cargo nextest run --workspace --locked --no-tests=pass

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install MSRV toolchain from workspace rust-version
        run: |
          msrv=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)
          rustup toolchain install "$msrv" --profile minimal
          echo "MSRV=$msrv" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo +"$MSRV" check --workspace --all-targets --locked

  bench-regression:
    # Base and this change built and measured on the same runner, interleaved:
    # shared runners are too noisy to compare with numbers from another run.
    name: benchmark regression (base vs this change)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Only for changes that can move the numbers
        id: scope
        run: |
          # The checkout is the PR merged into the current base: its first
          # parent is that base (pull_request.base.sha can be older).
          echo "BASE_SHA=$(git rev-parse HEAD^1)" >> "$GITHUB_ENV"
          if git diff --quiet HEAD^1 HEAD -- crates Cargo.toml Cargo.lock \
              rust-toolchain.toml examples/hello examples/counter scripts/bench-ab.py; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No change to the runtime, server or benchmarked examples: skipped." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: steps.scope.outputs.run == 'true'
        with:
          key: bench-ab
      - name: Compare (fails past +20% on any benchmark)
        if: steps.scope.outputs.run == 'true'
        run: python3 -I scripts/bench-ab.py "$BASE_SHA"

  sim:
    name: simulation (madsim, 200 seeds)
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: --cfg madsim
      WASMKEEP_SIM_SEEDS: "200"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: madsim
      # Every simulation but madsim_lease, the retired per-actor lease's:
      # the server no longer runs that protocol, so only the nightly runs it.
      - run: >-
          cargo test -p wasmkeep-sim --locked --target-dir target/madsim
          --lib --test madsim_admission --test madsim_alarm_index
          --test madsim_alarm_sweep --test madsim_drain
          --test madsim_node_lease --test madsim_replication

  s3:
    # MinIO no longer publishes container images, so this runs against
    # moto's S3 server, which enforces If-None-Match / If-Match like S3.
    name: leases on an S3 API (moto)
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_REGION: us-east-1
      AWS_ENDPOINT: http://127.0.0.1:5055
      AWS_ALLOW_HTTP: "true"
      WASMKEEP_TEST_S3_BUCKET: wasmkeep-test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-nextest
      - name: start the S3 server
        run: |
          pip install --quiet "moto[server]==5.2.5"
          moto_server -p 5055 > moto.log 2>&1 &
          for _ in $(seq 1 30); do
            curl -sf -o /dev/null http://127.0.0.1:5055/moto-api/ && break
            sleep 1
          done
          curl -sf -X PUT -H "Content-Length: 0" http://127.0.0.1:5055/wasmkeep-test
      - run: cargo nextest run -p wasmkeep-cluster --test s3 --locked
      - name: failover (kill the owner, production lease timings)
        run: cargo nextest run -p wasmkeep-cli --test failover --locked --no-capture
      - name: two nodes over the cluster listener (mutual TLS)
        run: cargo nextest run -p wasmkeep-cli --test cluster_tls --locked
      - name: cluster status against S3
        run: cargo nextest run -p wasmkeep-cli --test cluster_status --locked
      - name: deploy configuration against S3
        run: cargo nextest run -p wasmkeep-cli --test deploy_config --locked

  ltx:
    name: LTX conformance (Go reference)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: conformance/ltx/go.mod
          cache-dependency-path: conformance/ltx/go.sum
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-nextest
      - name: we decode files the reference wrote, and write ours
        run: cargo nextest run -p wasmkeep-storage --test ltx_conformance --locked
      - name: the reference verifies the files we wrote
        working-directory: conformance/ltx
        run: go run . verify ../../target/ltx-conformance/*.ltx
      - name: the committed fixtures are what the reference writes today
        working-directory: conformance/ltx
        run: |
          go run . gen ../../crates/wasmkeep-storage/tests/ltx
          git diff --exit-code -- ../../crates/wasmkeep-storage/tests/ltx

  languages:
    name: every language passes the same tests
    runs-on: ubuntu-24.04
    env:
      WASMKEEP_REQUIRE_LANGS: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-nextest,wasm-tools@1.263.0,wit-bindgen-cli@0.63.0
      - name: toolchains (C, Zig, Python)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang lld wasi-libc libclang-rt-18-dev-wasm32
          pip install ziglang==0.17.1 componentize-py==0.25.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.24.7"
          cache-dependency-path: |
            sdks/go/go.sum
            examples/go-*/go.sum
      - name: toolchains (Go)
        run: |
          curl -sSL https://github.com/tinygo-org/tinygo/releases/download/v0.39.0/tinygo0.39.0.linux-amd64.tar.gz | tar xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/tinygo/bin" >> "$GITHUB_PATH"
          go install go.bytecodealliance.org/cmd/wit-bindgen-go@v0.7.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: toolchains (D)
        run: |
          curl -sSL https://github.com/ldc-developers/ldc/releases/download/v1.43.0/ldc2-1.43.0-linux-x86_64.tar.xz | tar xJ -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/ldc2-1.43.0-linux-x86_64/bin" >> "$GITHUB_PATH"
      - name: toolchains (MoonBit)
        # Pinned by its moonc version (dated versions are not served) and
        # checked by SHA-256; the core library is bundled for wasm here.
        run: |
          v=0.10.20%2B65efd5b93
          home="$RUNNER_TEMP/moon"
          mkdir -p "$home/lib"
          curl -sSfL -o "$RUNNER_TEMP/moonbit.tar.gz" "https://cli.moonbitlang.com/binaries/$v/moonbit-linux-x86_64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/moonbit-core.tar.gz" "https://cli.moonbitlang.com/cores/core-$v.tar.gz"
          sha256sum -c <<SUMS
          80d987523308fa490eba9f1baf98df996a5a7891e118357553b7c2608c0597c5  $RUNNER_TEMP/moonbit.tar.gz
          8ec2a2c01335501d703867bb4eef5f92d3cd7e1ae1ee5f7f14d54d16d2c7c2b5  $RUNNER_TEMP/moonbit-core.tar.gz
          SUMS
          tar xzf "$RUNNER_TEMP/moonbit.tar.gz" -C "$home"
          find "$home/bin" -maxdepth 1 -type f -exec chmod +x {} +   # the tarball has no execute bits
          tar xzf "$RUNNER_TEMP/moonbit-core.tar.gz" -C "$home/lib"
          (cd "$home/lib/core" && MOON_HOME="$home" PATH="$home/bin:$PATH" moon bundle --target wasm --release)
          echo "MOON_HOME=$home" >> "$GITHUB_ENV"
          echo "$home/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "10.0.x"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          # componentize-dotnet and NativeAOT-LLVM: about 800 MB of preview packages.
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('examples/csharp-*/*.csproj', 'examples/csharp-*/nuget.config') }}
      - name: TypeScript SDK (types and WIT in sync with the host, type-check)
        working-directory: sdks/typescript
        run: |
          npm ci
          npm run sync
          git diff --exit-code -- wit types
          npm run check
          npm test
      - name: Go SDK (bindings and WIT in sync with the host)
        run: |
          sdks/go/scripts/generate.sh
          git add -N sdks/go
          git diff --exit-code -- sdks/go/internal/gen sdks/go/wit
      - name: build every example
        run: |
          for ex in examples/ts-*/; do (cd "$ex" && npm ci && npm run build && npm run build:starlingmonkey); done
          for ex in examples/c-*/; do "$ex/build.sh"; done
          for ex in examples/zig-*/; do ZIG="python -m ziglang" "$ex/build.sh"; done
          for ex in examples/py-*/; do "$ex/build.sh"; done
          for ex in examples/go-*/; do "$ex/build.sh"; done
          crates/wasmkeep-server/tests/guests/go-fetch/build.sh
          for ex in examples/d-*/; do "$ex/build.sh"; done
          for ex in examples/moonbit-*/; do "$ex/build.sh"; done
          for ex in examples/csharp-*/; do "$ex/build.sh"; done
      - name: the counter contract and the chat suite, against every language
        run: cargo nextest run -p wasmkeep-server --test languages --test chat --test jobs_langs --test workflows_ts --test workflows_langs --test fetch_langs --locked

  docs:
    name: docs site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: mdbook@0.5.4
      - name: build the site (fails on broken links)
        run: ./scripts/docs-site.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: docs-site
          path: target/book

  examples:
    name: examples
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - example: hello
            world: ""          # plain wasi:http component
          - example: counter
            world: actor       # must conform to wasmkeep:actor/actor
          - example: rate-limiter
            world: actor
          - example: chat-room
            world: actor
          - example: watch/monitor
            world: actor
            wasm: watch_monitor
          - example: watch/hub
            world: actor
            wasm: watch_hub
          - example: agent
            world: actor
          - example: jobs/kv
            world: actor
            wasm: jobs_kv
          - example: jobs/queue
            world: actor
            wasm: jobs_queue
          - example: jobs/app
            world: actor
            wasm: jobs_app
          - example: workflows/orders
            world: actor
            wasm: workflows_orders
          - example: workflows/ledger
            world: actor
            wasm: workflows_ledger
          - example: workflows/app
            world: actor
            wasm: workflows_app
    defaults:
      run:
        working-directory: examples/${{ matrix.example }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: examples/${{ matrix.example }}
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: wasm-tools@1.263.0
      - run: cargo fmt --check
      - run: cargo clippy --release --target wasm32-wasip2 --locked -- -D warnings
      - run: cargo build --release --target wasm32-wasip2 --locked
      - name: Validate component and print its WIT world
        run: |
          name="${{ matrix.wasm }}"
          [ -n "$name" ] || name=$(echo "${{ matrix.example }}" | tr - _)
          wasm=target/wasm32-wasip2/release/$name.wasm
          wasm-tools validate "$wasm"
          wasm-tools component wit "$wasm"
          if [ -n "${{ matrix.world }}" ]; then
            wasm-tools component targets "$GITHUB_WORKSPACE/crates/wasmkeep-wit/wit" \
              --world "${{ matrix.world }}" "$wasm"
          fi

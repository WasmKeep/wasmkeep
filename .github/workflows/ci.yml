name: CI

on:
  push:
    branches: [main]
  pull_request:
    # A draft starts nothing but the job "draft", which asks whether it is
    # still one (see that job and the jobs' conditions): marking it ready
    # for review starts the run.
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

# `bash` by name runs every step with `-eo pipefail`: a failure on the left
# of a pipe fails the step.
defaults:
  run:
    shell: bash

# A newer commit on the same branch or pull request replaces the run in
# progress, on main too: only the latest commit's result matters. A release
# needs a passing run on its commit (release.yml); if that run was replaced,
# run CI again on the commit from the Actions page.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # A pull request runs the fast jobs only (a minute or two): format, clippy,
  # MSRV, the simulations, the examples, licences, the docs. The suites that
  # take ten minutes (the tests on both Linux platforms and macOS, every
  # language, the S3 suites) run on main after the merge and nightly, and
  # `./scripts/check.sh --full` runs them before a merge, locally. A release
  # needs a passing run on its commit. Their names stay required checks: a
  # skipped job reports as passed.
  #
  # Documentation, benchmark result files and the two release workflows
  # (which run on a tag or a published release) are read by no code job: a pull
  # request that changes nothing else runs this job, "benchmark publication
  # paths" and "docs site" only. scripts/ci-changes.sh holds the list.
  #
  # Every other job needs this one and runs unless it answered the literal
  # "false". `!cancelled()` is what makes them run when this job fails:
  # without a status function they would be skipped, and a skipped job
  # counts as passed. A push to main always runs everything.
  #
  # A run started for a draft runs the job "draft" first and nothing else,
  # unless the pull request is no longer a draft by then: this job, "docs
  # site" and "benchmark publication paths" need "draft" and are skipped
  # only when it answered the literal "true", and the others follow this
  # job. In every other run "draft" is skipped and they run.
  draft:
    # The event's payload says what the pull request was when the event was
    # made. A push to a draft and "ready for review" in the same second
    # make two runs of one concurrency group, and the push's can be the one
    # that stays: it would skip every job as a draft's, which reports every
    # required check as passed, on a pull request that is ready, with no
    # other run to come. So a run started for a draft asks what the pull
    # request is now, and runs everything if it is ready. One short job
    # without a checkout; it never fails a draft: an answer it cannot get
    # counts as "ready", so that nothing passes without having run.
    name: draft
    if: ${{ github.event.pull_request.draft == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      now: ${{ steps.ask.outputs.now }}
    steps:
      - id: ask
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          now=
          for try in 1 2 3; do
            now=$(gh api "repos/$REPO/pulls/$NUMBER" --jq .draft) && break
            now=
            if [ "$try" -lt 3 ]; then sleep "$((try * 2))"; fi
          done
          case "$now" in
            true) echo "still a draft: nothing else runs" ;;
            false) echo "::notice::started for a draft that is ready for review now: every job runs" ;;
            *) echo "::warning::could not ask whether the pull request is still a draft: every job runs"; now=unknown ;;
          esac
          echo "now=$now" >> "$GITHUB_OUTPUT"

  changes:
    name: changes
    needs: draft
    if: ${{ !cancelled() && (github.event.pull_request.draft != true || needs.draft.outputs.now != 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 2 # a pull request's merge commit and its first parent, the base
          persist-credentials: false
      - id: classify
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
        run: ./scripts/ci-changes.sh "$EVENT" "$BASE" | tee -a "$GITHUB_OUTPUT"

  fmt:
    name: rustfmt
    timeout-minutes: 10
    needs: changes
    if: ${{ !cancelled() && needs.changes.result != 'skipped' && (needs.changes.result != 'success' || needs.changes.outputs.code != 'false') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: cargo fmt --all --check

  benchmark-publication:
    name: benchmark publication paths
    needs: draft
    if: ${{ !cancelled() && (github.event.pull_request.draft != true || needs.draft.outputs.now != 'true') }}
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - run: python3 -I scripts/test_check_benchmark_paths.py
      - run: python3 -I scripts/test_bench_ab.py
      - run: python3 -I scripts/test_ci_changes.py
      - name: CHANGELOG.md has a section for the workspace version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          [ -n "$(./scripts/release-notes.sh "$version")" ] \
            || { echo "::error::CHANGELOG.md has no section for $version"; exit 1; }
      - name: Every SDK manifest carries the workspace version
        run: |
          python3 -I scripts/test_check_versions.py
          python3 -I scripts/check-versions.py
      - name: Check every introduced commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ]; then
            python3 -I scripts/check-benchmark-paths.py --range "$BASE_SHA..HEAD"
          elif [ "${{ github.event_name }}" = push ]; then
            # A new branch or the first push: no base, so check the whole
            # history: each root commit's tree, then every commit after it.
            for root in $(git rev-list --max-parents=0 HEAD); do
              python3 -I scripts/check-benchmark-paths.py --rev "$root"
              if [ "$root" != "$(git rev-parse HEAD)" ]; then
                python3 -I scripts/check-benchmark-paths.py --range "$root..HEAD"
              fi
            done
          else
            echo "::error::Cannot determine the base commit; refusing a final-tree-only publication check."
            exit 2
          fi

  licenses:
    name: dependency licenses
    timeout-minutes: 15
    needs: changes
    if: ${{ !cancelled() && needs.changes.result != 'skipped' && (needs.changes.result != 'success' || needs.changes.outputs.code != 'false') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: ./scripts/licenses.sh > THIRD_PARTY_LICENSES.md

  deny:
    name: cargo-deny (advisories, licenses, sources)
    timeout-minutes: 15
    needs: changes
    if: ${{ !cancelled() && needs.changes.result != 'skipped' && (needs.changes.result != 'success' || needs.changes.outputs.code != 'false') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

  clippy:
    name: clippy
    timeout-minutes: 20
    needs: changes
    if: ${{ !cancelled() && needs.changes.result != 'skipped' && (needs.changes.result != 'success' || needs.changes.outputs.code != 'false') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  # Three jobs, not a matrix: a matrix skipped as a whole reports one check
  # under its unexpanded name, and each of these names is a required check.
  test-linux:
    name: test (ubuntu-latest)
    timeout-minutes: 45
    needs: changes
    if: ${{ !cancelled() && github.event_name != 'pull_request' && needs.changes.result != 'skipped' && (needs.changes.result != 'success' || needs.changes.outputs.code != 'false') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-nextest
      # A pull request leaves out part of the cluster suite's TLS copy
      # (.config/nextest.toml, profile `pr`); a push to main runs all of it.
      - run: cargo nextest run --workspace --locked --no-tests=pass ${{ github.event_name == 'pull_request' && '--profile pr' || '' }}

  test-linux-arm:
    name: test (ubuntu-24.04-arm)
    timeout-minutes: 45
    needs: changes
    if: ${{ !cancelled() && github.event_name != 'pull_request' && needs.changes.result != 'skipped' && (needs.changes.result != 'success' || needs.changes.outputs.code != 'false') }}
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-nextest
      # A pull request leaves out part of the cluster suite's TLS copy
      # (.config/nextest.toml, profile `pr`); a push to main runs all of it.
      - run: cargo nextest run --workspace --locked --no-tests=pass ${{ github.event_name == 'pull_request' && '--profile pr' || '' }}

  # Not on pull requests: macOS is no release target and has no code path of
  # its own, its runners are the scarcest, and this is the slowest job. It
  # runs on every push to main and nightly, so a break that only macOS shows
  # is seen minutes after its merge, and a release needs a passing run on
  # main. On a pull request the check reports as skipped.
  test-macos:
    name: test (macos-latest)
    timeout-minutes: 60
    needs: changes
    if: ${{ !cancelled() && github.event_name != 'pull_request' && needs.changes.result != 'skipped' && (needs.changes.result != 'success' || needs.changes.outputs.code != 'false') }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-nextest
      - run: cargo nextest run --workspace --locked --no-tests=pass

  msrv:
    name: MSRV
    timeout-minutes: 20
    needs: changes
    if: ${{ !cancelled() && needs.changes.result != 'skipped' && (needs.changes.result != 'success' || needs.changes.outputs.code != 'false') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install MSRV toolchain from workspace rust-version
        run: |
          msrv=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)
          rustup toolchain install "$msrv" --profile minimal
          echo "MSRV=$msrv" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo +"$MSRV" check --workspace --all-targets --locked

  bench-regression:
    # Base and this change built and measured on the same runner, interleaved:
    # shared runners are too noisy to compare with numbers from another run.
    name: benchmark regression (base vs this change)
    needs: changes
    if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.changes.result != 'skipped' && (needs.changes.result != 'success' || needs.changes.outputs.code != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Only for changes that can move the numbers
        id: scope
        run: |
          # The checkout is the PR merged into the current base: its first
          # parent is that base (pull_request.base.sha can be older).
          echo "BASE_SHA=$(git rev-parse HEAD^1)" >> "$GITHUB_ENV"
          if git diff --quiet HEAD^1 HEAD -- crates Cargo.toml Cargo.lock \
              rust-toolchain.toml examples/hello examples/counter scripts/bench-ab.py; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No change to the runtime, server or benchmarked examples: skipped." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: steps.scope.outputs.run == 'true'
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          key: bench-ab
      - name: Compare (fails past +20% on any benchmark)
        if: steps.scope.outputs.run == 'true'
        run: python3 -I scripts/bench-ab.py "$BASE_SHA"

  sim:
    name: simulation (madsim, 200 seeds)
    timeout-minutes: 20
    needs: changes
    if: ${{ !cancelled() && needs.changes.result != 'skipped' && (needs.changes.result != 'success' || needs.changes.outputs.code != 'false') }}
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: --cfg madsim
      WASMKEEP_SIM_SEEDS: "200"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          key: madsim
      # Every simulation but madsim_lease, the retired per-actor lease's:
      # the server no longer runs that protocol, so only the nightly runs it.
      - run: >-
          cargo test -p wasmkeep-sim --locked --target-dir target/madsim
          --lib --test madsim_admission --test madsim_alarm_index
          --test madsim_alarm_sweep --test madsim_drain
          --test madsim_migrate --test madsim_node_lease
          --test madsim_replication --test madsim_two_apps

  s3:
    # MinIO no longer publishes container images, so this runs against
    # moto's S3 server, which enforces If-None-Match / If-Match like S3.
    name: leases on an S3 API (moto)
    timeout-minutes: 25
    needs: changes
    if: ${{ !cancelled() && github.event_name != 'pull_request' && needs.changes.result != 'skipped' && (needs.changes.result != 'success' || needs.changes.outputs.code != 'false') }}
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_REGION: us-east-1
      AWS_ENDPOINT: http://127.0.0.1:5055
      AWS_ALLOW_HTTP: "true"
      WASMKEEP_TEST_S3_BUCKET: wasmkeep-test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-nextest
      - name: start the S3 server
        run: |
          pip install --quiet "moto[server]==5.2.5"
          moto_server -p 5055 > moto.log 2>&1 &
          for _ in $(seq 1 30); do
            curl -sf -o /dev/null http://127.0.0.1:5055/moto-api/ && break
            sleep 1
          done
          curl -sf -X PUT -H "Content-Length: 0" http://127.0.0.1:5055/wasmkeep-test
      - run: cargo nextest run -p wasmkeep-cluster --test s3 --locked
      - name: failover (kill the owner, production lease timings)
        run: cargo nextest run -p wasmkeep-cli --test failover --locked --no-capture
      - name: two nodes over the cluster listener (mutual TLS)
        run: cargo nextest run -p wasmkeep-cli --test cluster_tls --locked
      - name: cluster status against S3
        run: cargo nextest run -p wasmkeep-cli --test cluster_status --locked
      - name: deploy configuration against S3
        run: cargo nextest run -p wasmkeep-cli --test deploy_config --locked

  ltx:
    name: LTX conformance (Go reference)
    timeout-minutes: 15
    needs: changes
    if: ${{ !cancelled() && needs.changes.result != 'skipped' && (needs.changes.result != 'success' || needs.changes.outputs.code != 'false') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: conformance/ltx/go.mod
          cache-dependency-path: conformance/ltx/go.sum
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-nextest
      - name: we decode files the reference wrote, and write ours
        run: cargo nextest run -p wasmkeep-storage --test ltx_conformance --locked
      - name: the reference verifies the files we wrote
        working-directory: conformance/ltx
        run: go run . verify ../../target/ltx-conformance/*.ltx
      - name: the committed fixtures are what the reference writes today
        working-directory: conformance/ltx
        run: |
          go run . gen ../../crates/wasmkeep-storage/tests/ltx
          git diff --exit-code -- ../../crates/wasmkeep-storage/tests/ltx

  languages:
    name: every language passes the same tests
    timeout-minutes: 40
    needs: changes
    if: ${{ !cancelled() && github.event_name != 'pull_request' && needs.changes.result != 'skipped' && (needs.changes.result != 'success' || needs.changes.outputs.code != 'false') }}
    runs-on: ubuntu-24.04
    env:
      WASMKEEP_REQUIRE_LANGS: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            sdks/typescript/package-lock.json
            examples/ts-*/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            sdks/python/pyproject.toml
            .github/workflows/ci.yml
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-nextest,wasm-tools@1.263.0,wit-bindgen-cli@0.63.0
      - name: toolchains (C, Zig, Python)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang lld wasi-libc libclang-rt-18-dev-wasm32
          pip install ziglang==0.17.1 componentize-py==0.25.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.24.7"
          cache-dependency-path: |
            sdks/go/go.sum
            examples/go-*/go.sum
      - name: toolchains (Go)
        run: |
          curl -sSL https://github.com/tinygo-org/tinygo/releases/download/v0.39.0/tinygo0.39.0.linux-amd64.tar.gz | tar xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/tinygo/bin" >> "$GITHUB_PATH"
          go install go.bytecodealliance.org/cmd/wit-bindgen-go@v0.7.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: toolchains (D)
        run: |
          curl -sSL https://github.com/ldc-developers/ldc/releases/download/v1.43.0/ldc2-1.43.0-linux-x86_64.tar.xz | tar xJ -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/ldc2-1.43.0-linux-x86_64/bin" >> "$GITHUB_PATH"
      - name: toolchains (MoonBit)
        # Pinned by its moonc version (dated versions are not served) and
        # checked by SHA-256; the core library is bundled for wasm here.
        run: |
          v=0.10.20%2B65efd5b93
          home="$RUNNER_TEMP/moon"
          mkdir -p "$home/lib"
          curl -sSfL -o "$RUNNER_TEMP/moonbit.tar.gz" "https://cli.moonbitlang.com/binaries/$v/moonbit-linux-x86_64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/moonbit-core.tar.gz" "https://cli.moonbitlang.com/cores/core-$v.tar.gz"
          sha256sum -c <<SUMS
          80d987523308fa490eba9f1baf98df996a5a7891e118357553b7c2608c0597c5  $RUNNER_TEMP/moonbit.tar.gz
          8ec2a2c01335501d703867bb4eef5f92d3cd7e1ae1ee5f7f14d54d16d2c7c2b5  $RUNNER_TEMP/moonbit-core.tar.gz
          SUMS
          tar xzf "$RUNNER_TEMP/moonbit.tar.gz" -C "$home"
          find "$home/bin" -maxdepth 1 -type f -exec chmod +x {} +   # the tarball has no execute bits
          tar xzf "$RUNNER_TEMP/moonbit-core.tar.gz" -C "$home/lib"
          (cd "$home/lib/core" && MOON_HOME="$home" PATH="$home/bin:$PATH" moon bundle --target wasm --release)
          echo "MOON_HOME=$home" >> "$GITHUB_ENV"
          echo "$home/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "10.0.x"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          # componentize-dotnet and NativeAOT-LLVM: about 800 MB of preview packages.
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('examples/csharp-*/*.csproj', 'examples/csharp-*/nuget.config') }}
      - name: toolchains (standard Go, componentize-go)
        # Go 1.27 beside TinyGo's 1.24, for examples/go-std-counter (GO_STD).
        run: |
          curl -sSfL -o "$RUNNER_TEMP/go1.27.3.tar.gz" https://go.dev/dl/go1.27.3.linux-amd64.tar.gz
          echo "65efbc80fdc1fa2cd2631cad5b481777a68e8725f34e89f50fc6ac714e379b40  $RUNNER_TEMP/go1.27.3.tar.gz" | sha256sum -c
          mkdir -p "$RUNNER_TEMP/go127"
          tar xzf "$RUNNER_TEMP/go1.27.3.tar.gz" -C "$RUNNER_TEMP/go127"
          GOTOOLCHAIN=local GOBIN="$RUNNER_TEMP/go127/tools" "$RUNNER_TEMP/go127/go/bin/go" install github.com/bytecodealliance/componentize-go@v0.5.1
          echo "GO_STD=$RUNNER_TEMP/go127/go/bin/go" >> "$GITHUB_ENV"
          echo "COMPONENTIZE_GO=$RUNNER_TEMP/go127/tools/componentize-go" >> "$GITHUB_ENV"
      - name: TypeScript SDK (types and WIT in sync with the host, type-check)
        working-directory: sdks/typescript
        run: |
          npm ci
          npm run sync
          git diff --exit-code -- wit types
          npm run check
          npm test
      - name: TypeScript SDK (the packed tarball, installed outside the checkout)
        run: sdks/typescript/scripts/pack-test.sh "$RUNNER_TEMP/ts-sdk-pack"
      - name: Go SDK (bindings and WIT in sync with the host)
        run: |
          sdks/go/scripts/generate.sh
          git add -N sdks/go
          git diff --exit-code -- sdks/go/internal/gen sdks/go/wit
      - name: Go SDK (vet, unit tests)
        working-directory: sdks/go
        run: |
          go vet ./...
          go test ./...
      - name: build every example
        run: |
          for ex in examples/ts-*/; do (cd "$ex" && npm ci && npm run build && npm run build:starlingmonkey); done
          for ex in examples/c-*/; do "$ex/build.sh"; done
          for ex in examples/zig-*/; do ZIG="python -m ziglang" "$ex/build.sh"; done
          for ex in examples/py-*/; do "$ex/build.sh"; done
          for ex in examples/go-*/; do "$ex/build.sh"; done
          crates/wasmkeep-server/tests/guests/go-fetch/build.sh
          for ex in examples/d-*/; do "$ex/build.sh"; done
          for ex in examples/moonbit-*/; do "$ex/build.sh"; done
          for ex in examples/csharp-*/; do "$ex/build.sh"; done
      # The Python SDK as a package: its unit tests, its WIT copy against the
      # host's, then the wheel built, checked and installed alone in a fresh
      # environment. The counter built from that installed wheel replaces the
      # one built from the tree, so the contract test below runs on it (the
      # chat room and the jobs app are still built from the tree).
      - name: Python SDK (unit tests, WIT in sync, wheel built and installed)
        run: |
          sdks/python/test/run.sh
          diff -r crates/wasmkeep-wit/wit sdks/python/wasmkeep/wit
          pip install build==1.6.1 twine==7.0.0
          sdks/python/scripts/package.sh "$RUNNER_TEMP/python-package"
          cp "$RUNNER_TEMP/python-package/counter.wasm" examples/py-counter/counter.wasm
      - name: the counter contract and the chat suite, against every language
        run: cargo nextest run -p wasmkeep-server --test languages --test chat --test jobs_langs --test workflows_ts --test workflows_langs --test fetch_langs --locked
      - name: the todo front, in Rust and in TypeScript, with its actor
        run: cargo nextest run -p wasmkeep-cli --test todo_front --locked

  docs:
    name: docs site
    needs: draft
    if: ${{ !cancelled() && (github.event.pull_request.draft != true || needs.draft.outputs.now != 'true') }}
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: mdbook@0.5.4
      - name: build the site (fails on broken links)
        run: ./scripts/docs-site.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: docs-site
          path: target/book

  examples:
    # One job for every Rust example, each its own Cargo workspace. An
    # example that fails does not stop the others; the job fails at the end.
    name: examples
    timeout-minutes: 25
    needs: changes
    if: ${{ !cancelled() && needs.changes.result != 'skipped' && (needs.changes.result != 'success' || needs.changes.outputs.code != 'false') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: |
            examples/hello
            examples/counter
            examples/rate-limiter
            examples/chat-room
            examples/watch/monitor
            examples/watch/hub
            examples/agent
            examples/jobs/kv
            examples/jobs/queue
            examples/jobs/app
            examples/workflows/orders
            examples/workflows/ledger
            examples/workflows/app
            examples/todo-front/todos
            examples/todo-front/front
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: wasm-tools@1.263.0
      - name: Format, lint, build and validate each example
        run: |
          # Directory, WIT world ("-": a plain wasi:http component), then
          # the component's file name when it is not the directory's.
          examples='
            hello             -
            counter           actor
            rate-limiter      actor
            chat-room         actor
            watch/monitor     actor  watch_monitor
            watch/hub         actor  watch_hub
            agent             actor
            jobs/kv           actor  jobs_kv
            jobs/queue        actor  jobs_queue
            jobs/app          actor  jobs_app
            workflows/orders  actor  workflows_orders
            workflows/ledger  actor  workflows_ledger
            workflows/app     actor  workflows_app
            todo-front/todos  actor  todo_todos
            todo-front/front  front  todo_front
          '
          # One && chain: `set -e` is off inside a function called on the
          # left of `||`, so a failed command would not stop it otherwise.
          check() {
            local dir=$1 world=$2 wasm=target/wasm32-wasip2/release/${3:-${1//-/_}}.wasm
            cd "$GITHUB_WORKSPACE/examples/$dir" &&
              cargo fmt --check &&
              cargo clippy --release --target wasm32-wasip2 --locked -- -D warnings &&
              cargo build --release --target wasm32-wasip2 --locked &&
              wasm-tools validate "$wasm" &&
              wasm-tools component wit "$wasm" &&
              if [ "$world" != - ]; then
                wasm-tools component targets "$GITHUB_WORKSPACE/crates/wasmkeep-wit/wit" \
                  --world "$world" "$wasm"
              fi
          }
          failed=()
          while read -r dir world wasm; do
            [ -n "$dir" ] || continue
            echo "::group::examples/$dir"
            check "$dir" "$world" "$wasm" || failed+=("$dir")
            echo "::endgroup::"
          done <<<"$examples"
          if [ "${#failed[@]}" -gt 0 ]; then
            printf '::error::examples/%s failed\n' "${failed[@]}"
            exit 1
          fi
          echo "every example passed"
      # The Rust SDK as a registry would receive it, and a consumer built
      # against the unpacked package. Nothing is published.
      - name: the Rust SDK packaged, then examples/counter against the unpacked crate
        run: ./scripts/package-rust-sdk.sh

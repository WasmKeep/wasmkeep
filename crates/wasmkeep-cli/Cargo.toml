[package]
name = "wasmkeep-cli"
description = "The wasmkeep command-line tool: serve, dev, deploy, cluster, actor, secrets."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[[bin]]
name = "wasmkeep"
path = "src/main.rs"

[dependencies]
# Inspector HTTP transport and bodies: reuse the workspace server stack.
hyper.workspace = true
hyper-util.workspace = true
http-body-util.workspace = true
bytes.workspace = true
# Inspector authentication: OS entropy and constant-time comparison, already locked.
getrandom = "=0.4.3"
subtle = "=2.6.1"
# ADR 0030: validate and deterministically generate precompressed assets.
brotli = "=8.0.3"
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
# Warn when asset names are not NFC, without changing their bytes.
unicode-normalization = "=0.1.26"
# Local feed progress, using the existing workspace SQLite build.
rusqlite.workspace = true
# Writes Parquet, the format warehouses read; no smaller maintained writer exists.
parquet = { version = "=60.1.0", default-features = false }
# Content-addressed backup objects and manifest integrity; already in workspace.
sha2.workspace = true
# Local export queries and result values, using the server's SQLite build.
wasmkeep-storage.workspace = true
# Automatically cleaned SQL export directories; already a workspace dependency.
tempfile.workspace = true
# RFC3339 operator timestamps; already locked through object_store.
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
# Lossless BLOB output in JSON; already locked through object_store.
base64 = "=0.23.1"
wasmkeep-runtime.workspace = true
wasmkeep-server.workspace = true
wasmkeep-cluster.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "signal"] }
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
anyhow.workspace = true
wasmtime.workspace = true
object_store = { workspace = true, features = ["aws", "fs"] }
reqwest.workspace = true
# Concurrent requests in `cluster diagnose`; already a workspace dependency.
futures-util.workspace = true
# The workspace's rustix, with `thread` for prctl(PR_SET_THP_DISABLE).
rustix = { workspace = true, features = ["thread"] }
# wasmkeep.toml, the project file (ADR 0026).
toml.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
# Enforce a LIST/GET-only source in backup race tests; already in workspace.
async-trait = "=0.1.92"
tempfile.workspace = true

[lints]
workspace = true

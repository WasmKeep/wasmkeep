[package]
name = "wasmkeep-cli"
description = "The wasmkeep command-line tool: serve, dev, deploy, cluster, actor, secrets."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[[bin]]
name = "wasmkeep"
path = "src/main.rs"

[dependencies]
wasmkeep-runtime.workspace = true
wasmkeep-server.workspace = true
wasmkeep-cluster.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "signal"] }
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
anyhow.workspace = true
wasmtime.workspace = true
object_store = { workspace = true, features = ["aws"] }
reqwest.workspace = true
# Concurrent requests in `cluster diagnose`; already a workspace dependency.
futures-util.workspace = true
# The workspace's rustix, with `thread` for prctl(PR_SET_THP_DISABLE).
rustix = { workspace = true, features = ["thread"] }
# wasmkeep.toml, the project file (ADR 0026).
toml.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true

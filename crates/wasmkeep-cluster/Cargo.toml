[package]
name = "wasmkeep-cluster"
description = "Leases, heartbeats, node discovery and request forwarding."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[features]
default = ["object-store"]
# Production bucket adapter. Off in the madsim simulation, which builds only
# the trait-based protocol code.
object-store = ["dep:object_store"]
# Test-only, set by no release build: with it, WASMKEEP_TEST_VERSION in the
# build's environment replaces the version the build reports, marked `+test`
# (build.rs). For scripts/mixed-version.sh alone.
test-version = []

[dependencies]
thiserror.workspace = true
object_store = { workspace = true, optional = true }
# Not optional: the upgrade status reads overlap with it in every build.
futures-util.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros"] }
object_store = { workspace = true, features = ["aws"] }

[lints]
workspace = true

[package]
name = "blob-actor"
description = "Test-only actor calling wasmkeep:actor/blobs through the raw bindings."
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
wasmkeep-sdk = { path = "../../../../wasmkeep-sdk" }

[profile.release]
opt-level = "s"
strip = true

[package]
name = "test-front"
description = "Test-only front (world wasmkeep:actor/front): calls actors, echoes headers, answers chosen statuses."
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false

# Built for wasm32-wasip2 by the server tests; its own workspace.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = { version = "=0.63.0", default-features = false, features = ["macros", "realloc"] }
wasip2 = "=2.0.1"

[profile.release]
opt-level = "s"
strip = true

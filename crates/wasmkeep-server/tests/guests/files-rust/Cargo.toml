[package]
name = "files-rust"
description = "Test-only actor storing and listing files with the Rust SDK (wasmkeep_sdk::blobs)."
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
wasmkeep-sdk = { path = "../../../../wasmkeep-sdk" }

[profile.release]
opt-level = "s"
strip = true

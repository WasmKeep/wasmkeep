[package]
name = "misbehave"
description = "Test-only wasi:http guest that loops forever or panics on request."
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false

# Built for wasm32-wasip2 by the server tests; its own workspace.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
wasip2 = "=2.0.1"

[profile.release]
opt-level = "s"
strip = true

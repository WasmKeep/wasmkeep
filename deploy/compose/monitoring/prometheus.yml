# Scrapes the three nodes of compose.yaml (with monitoring.yaml), and
# evaluates the alert rules of deploy/prometheus/alerts.yml (shown on
# Prometheus's Alerts page; no Alertmanager here, so nothing is sent).
global:
  scrape_interval: 5s
  evaluation_interval: 5s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: wasmkeep
    static_configs:
      - targets: ["a:9100", "b:9100", "c:9100"]

# cargo-nextest settings for the local gate (scripts/check.sh), anyone
# running the suites by hand, and CI (which runs pull requests with the
# `pr` profile below).

[profile.default]
# A test running past a minute is reported, and ended after two: a hung test
# fails the run instead of holding it forever.
slow-timeout = { period = "60s", terminate-after = 2 }

[profile.default.junit]
# target/nextest/default/junit.xml: which tests failed, how long each took,
# to tell a flaky test from a slow one over several runs.
path = "junit.xml"

[test-groups]
# The multi-node suites start several nodes per test with tight lease
# timings; run too many at once on a loaded machine, they miss those timings
# (the flaky multi-node tests seen so far all come from them).
cluster = { max-threads = 8 }
# The default-budget room/window and fanout tests retain the real 50 ms
# CPU budget alongside their fuel ceilings. Serialize them to avoid
# competing with one another; fuel does not remove CPU-budget sensitivity.
big-room = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'binary(cluster) | binary(cluster_over_tls) | binary(revocation) | binary(cluster_tls) | binary(failover) | binary(cluster_status)'
test-group = 'cluster'

[[profile.default.overrides]]
filter = '(binary(big_room) | binary(room_edge)) & (test(/default_budget/) | test(/_fuel/))'
test-group = 'big-room'
slow-timeout = { period = "60s", terminate-after = 4 }

[[profile.default.overrides]]
# The soak (bench/soak.sh) runs for its configured time, 30 minutes to 12
# hours, and failover waits production lease timings: reported when slow,
# never ended for it.
filter = 'binary(soak) | binary(failover)'
slow-timeout = { period = "300s" }

[[profile.default.overrides]]
# The mixed-version check (scripts/mixed-version.sh, ignored and gated on
# WASMKEEP_MIXED_VERSION): about seven minutes after the release build;
# ended after half an hour, its trap then stopping the nodes it started.
filter = 'binary(=mixed_version)'
slow-timeout = { period = "300s", terminate-after = 6 }

[[profile.default.overrides]]
# scripts/check.sh --s3 uses the default profile. Diagnose does 1,001
# writes and deletes plus conditional-write retries on a real bucket;
# the fleet pass took about 230 s. Keep those checks, allow up to 600 s,
# and still terminate a hung test.
filter = 'binary(=cluster_diagnose)'
slow-timeout = { period = "120s", terminate-after = 5 }

[[profile.default.overrides]]
# The open-file tests run a node under a hard 1,024-descriptor limit and
# churn 2,000 actors through residency with sockets open (ADR 0037 leaves
# about 96 resident at that limit); a slower runner, such as macOS CI,
# needs more than two minutes for that. Still ended if it hangs.
filter = 'binary(open_files)'
slow-timeout = { period = "120s", terminate-after = 4 }

[[profile.default.overrides]]
# Known flake: room_scaling_split_reconnect_and_merge occasionally misses a
# step on a loaded machine (the split and merge run on real second-scale
# timers over four sockets, and no single race in the test explains it).
# Run again, up to twice, and reported as FLAKY in the summary and
# junit.xml, so it stays visible; three failures in a row still fail.
filter = 'binary(=room_scaling) & test(=room_scaling_split_reconnect_and_merge)'
retries = { backoff = "fixed", count = 2, delay = "2s" }

[[profile.default.overrides]]
# Each room_cluster test builds its front guest, starts three nodes, joins
# 30 or 300 clients, kills a node and runs 450 publish rounds of at least
# 100 ms: about 70 s on a quiet workstation, more than the default two
# minutes on the arm64 runner and close to three on macOS. Its own
# deadlines catch a stalled step; ended after five minutes if it hangs.
filter = 'binary(=room_cluster)'
slow-timeout = { period = "60s", terminate-after = 5 }

[[profile.default.overrides]]
# This single-client test cold-compiles six StarlingMonkey components
# (about 13 MB each, the JS engine embedded) before serving requests: about
# 127 CPU-seconds of compiling, 39 s on four otherwise idle cores and under
# 5 s once cached. Serving the requests takes under a second. In the
# languages job the compiling shares four vCPUs with three other tests, so
# its time follows the runner: 141 to 187 s in most runs, and 171 and 277 s
# on the same commit in two runs. It then went past five minutes on a
# slower runner with no change to its compile cost (the same CPU time before
# and after the 0.8.0 changes). Ended after ten minutes if it hangs.
filter = 'binary(=big_room) & test(=typescript_big_room_starlingmonkey)'
slow-timeout = { period = "60s", terminate-after = 10 }

[[profile.default.overrides]]
# `wasmkeep new`: each test builds a generated project from cold (a fresh
# target directory, release builds with LTO), then serves it.
filter = 'binary(new_project)'
slow-timeout = { period = "120s", terminate-after = 5 }

# Pull requests (ci.yml). The cluster suite is compiled twice, plain and
# over mutual TLS (tests/cluster_over_tls.rs); the TLS copy differs only
# where nodes talk to each other. A pull request runs it without the
# modules that talk to the bucket alone, keeping their two tests that do
# cross nodes; nightly and dispatched CI runs run all of it. Written as what is left out,
# so a new or renamed module runs until someone lists it here.
[profile.pr]
default-filter = 'not (binary(cluster_over_tls) & test(/^suite::(alarms|bucket|deploys|durable_writes)::/)) | test(=suite::deploys::existing_access_checks_the_bucket_and_leaves_nothing_for_unknown_names) | test(=suite::deploys::deployed_rules_and_configuration_reach_nodes_started_without_any)'

[profile.macos]
# CI's macOS job (.github/workflows/ci.yml). Hosted macOS runners are
# slower and noisier than the Linux ones: a test that misses a timing there
# is run again, up to twice, and reported as FLAKY in the summary and in
# junit.xml, so it stays visible for the testing pass instead of failing
# the nightly run and blocking a release. A test failing three times in a
# row still fails. Timeouts are half again as long as the default.
retries = { backoff = "fixed", count = 2, delay = "2s" }
slow-timeout = { period = "90s", terminate-after = 2 }

[profile.macos.junit]
path = "junit.xml"

# cargo-nextest settings for the local gate (scripts/check.sh), anyone
# running the suites by hand, and CI (which runs pull requests with the
# `pr` profile below).

[profile.default]
# A test running past a minute is reported, and ended after two: a hung test
# fails the run instead of holding it forever.
slow-timeout = { period = "60s", terminate-after = 2 }

[profile.default.junit]
# target/nextest/default/junit.xml: which tests failed, how long each took,
# to tell a flaky test from a slow one over several runs.
path = "junit.xml"

[test-groups]
# The multi-node suites start several nodes per test with tight lease
# timings; run too many at once on a loaded machine, they miss those timings
# (the flaky multi-node tests seen so far all come from them).
cluster = { max-threads = 8 }

[[profile.default.overrides]]
filter = 'binary(cluster) | binary(cluster_over_tls) | binary(revocation) | binary(cluster_tls) | binary(failover) | binary(cluster_status)'
test-group = 'cluster'

[[profile.default.overrides]]
# The soak (bench/soak.sh) runs for its configured time, 30 minutes to 12
# hours, and failover waits production lease timings: reported when slow,
# never ended for it.
filter = 'binary(soak) | binary(failover)'
slow-timeout = { period = "300s" }

# Pull requests (ci.yml). The cluster suite is compiled twice, plain and
# over mutual TLS (tests/cluster_over_tls.rs); the TLS copy differs only
# where nodes talk to each other. A pull request runs it without the
# modules that talk to the bucket alone, keeping their two tests that do
# cross nodes; pushes to main run all of it. Written as what is left out,
# so a new or renamed module runs until someone lists it here.
[profile.pr]
default-filter = 'not (binary(cluster_over_tls) & test(/^suite::(alarms|bucket|deploys|durable_writes)::/)) | test(=suite::deploys::existing_access_checks_the_bucket_and_leaves_nothing_for_unknown_names) | test(=suite::deploys::deployed_rules_and_configuration_reach_nodes_started_without_any)'

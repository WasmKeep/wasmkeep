[package]
name = "rate-limiter"
description = "Fixed-window rate limiter: one actor per key, alarms close windows, idle keys delete themselves."
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false

# Built for wasm32-wasip2, so it is its own workspace, outside the host one.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
wasmkeep-sdk = { path = "../../crates/wasmkeep-sdk" }

[profile.release]
opt-level = "s"
strip = true
lto = true
codegen-units = 1

[package]
name = "watch-hub"
description = "Watch, an uptime monitor on WasmKeep: the hub class."
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false

# Built for wasm32-wasip2, so it is its own workspace, outside the host one.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
wasmkeep-sdk = { path = "../../../crates/wasmkeep-sdk" }
# JSON for the HTTP API and the hub/monitor calls.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
strip = true
lto = true
codegen-units = 1

[package]
name = "agent"
description = "An AI agent on WasmKeep: one actor per conversation, a model over HTTP, reminders on alarms."
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false

# Built for wasm32-wasip2, so it is its own workspace, outside the host one.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
wasmkeep-sdk = { path = "../../crates/wasmkeep-sdk" }
# JSON for the chat-completions API and the history (as in examples/watch).
serde_json = "1"

[profile.release]
opt-level = "s"
strip = true
lto = true
codegen-units = 1

[package]
name = "hello"
description = "Smallest WasmKeep example: a wasi:http component that greets and echoes the request line."
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false

# Built for wasm32-wasip2, so it is its own workspace, outside the host one.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
wasip2 = "=2.0.1"

[profile.release]
opt-level = "s"
strip = true
lto = true
codegen-units = 1
